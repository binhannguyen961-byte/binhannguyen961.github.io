<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Player Online - WebGL Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: 'VT323', monospace;
            user-select: none;
        }

        /* Hiệu ứng làm vỡ hạt 3D giống thời PS1 */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated; /* Quan trọng để tạo nét retro */
        }

        /* Lớp sọc nhiễu CRT (Màn hình lồi cổ điển) */
        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Giao diện Menu */
        #menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: black;
            color: white;
            z-index: 20;
        }
        #menu h1 { font-size: 5rem; text-transform: uppercase; letter-spacing: 5px; text-shadow: 2px 2px red; margin-bottom: 10px; }
        #menu p { font-size: 1.5rem; color: #aaa; }
        #play-btn {
            margin-top: 30px; padding: 10px 30px; font-size: 2rem;
            background: none; color: white; border: 2px solid white;
            cursor: pointer; font-family: 'VT323', monospace;
            transition: 0.3s;
        }
        #play-btn:hover { background: white; color: black; }

        /* Giao diện trong game (UI) */
        #ui { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            background-color: white; transform: translate(-50%, -50%);
        }
        #server-info { position: absolute; top: 20px; right: 20px; color: white; font-size: 1.5rem; text-align: right;}
        
        #chatbox {
            position: absolute; bottom: 30px; left: 30px; width: 400px;
            color: #ddd; font-size: 1.3rem;
            text-shadow: 1px 1px 0 #000;
        }
        .chat-msg { margin-bottom: 5px; opacity: 1; transition: opacity 2s; }
        .system-msg { color: #f00; }
    </style>
    
    <!-- Import thư viện Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div class="crt-overlay"></div>

    <div id="menu">
        <h1>CTF_EMPTY_SERVER</h1>
        <p>A "No Player Online" Recreation</p>
        <p>Sử dụng W A S D để di chuyển, Chuột để xoay góc nhìn.</p>
        <button id="play-btn">JOIN SERVER</button>
    </div>

    <div id="ui">
        <div id="crosshair"></div>
        <div id="server-info">
            Server: NA_CTF_01<br>
            Players: 1/8
        </div>
        <div id="chatbox">
            <div class="chat-msg system-msg">[SERVER] Welcome to the server. Waiting for players...</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // 1. CẤU HÌNH CƠ BẢN
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        scene.fog = new THREE.Fog(0x111111, 2, 40); // Sương mù xám xịt tạo cảm giác cô lập

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.y = 2; // Chiều cao mắt người chơi

        // Render ở độ phân giải thấp để tạo hiệu ứng PS1 retro
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth / 3, window.innerHeight / 3); 
        renderer.domElement.style.width = '100vw';
        renderer.domElement.style.height = '100vh';
        document.body.appendChild(renderer.domElement);

        // 2. KHỞI TẠO MÔI TRƯỜNG MAP
        const textureLoader = new THREE.TextureLoader();
        
        // Sàn nhà
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Tạo các bức tường và cột mốc (Map CTF giả lập)
        const wallGeo = new THREE.BoxGeometry(10, 10, 2);
        const wallMat = new THREE.MeshBasicMaterial({ color: 0x552222 }); // Tường màu gạch cũ

        const pos = [ [0, -20], [0, 20], [-20, 0], [20, 0], [-10, 10], [10, -10] ];
        pos.forEach(p => {
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.set(p[0], 5, p[1]);
            if(p[0] === 0) wall.rotation.y = Math.PI / 2;
            scene.add(wall);
        });

        // 3. THỰC THỂ BÍ ẨN (GHOST)
        const ghostGeo = new THREE.CylinderGeometry(0.5, 0.5, 3, 8);
        const ghostMat = new THREE.MeshBasicMaterial({ color: 0x000000 }); // Đen tuyền
        const ghost = new THREE.Mesh(ghostGeo, ghostMat);
        ghost.position.set(0, -10, 0); // Giấu đi lúc đầu
        scene.add(ghost);

        // 4. HỆ THỐNG ĐIỀU KHIỂN
        const controls = new PointerLockControls(camera, document.body);
        const menu = document.getElementById('menu');
        const ui = document.getElementById('ui');
        const playBtn = document.getElementById('play-btn');

        playBtn.addEventListener('click', () => {
            controls.lock();
        });

        controls.addEventListener('lock', () => {
            menu.style.display = 'none';
            ui.style.display = 'block';
        });

        controls.addEventListener('unlock', () => {
            menu.style.display = 'flex';
            ui.style.display = 'none';
        });

        // Xử lý phím di chuyển
        const move = { forward: false, backward: false, left: false, right: false };
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'KeyW': move.forward = true; break;
                case 'KeyS': move.backward = true; break;
                case 'KeyA': move.left = true; break;
                case 'KeyD': move.right = true; break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': move.forward = false; break;
                case 'KeyS': move.backward = false; break;
                case 'KeyA': move.left = false; break;
                case 'KeyD': move.right = false; break;
            }
        });

        // 5. KỊCH BẢN KINH DỊ (EVENTS)
        let timeElapsed = 0;
        let eventTriggered = false;
        const chatbox = document.getElementById('chatbox');

        function addChat(text, isSystem = false) {
            const div = document.createElement('div');
            div.className = 'chat-msg' + (isSystem ? ' system-msg' : '');
            div.innerText = text;
            chatbox.appendChild(div);
        }

        // 6. VÒNG LẶP GAME (GAME LOOP)
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (controls.isLocked === true) {
                // Logic Di chuyển
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(move.forward) - Number(move.backward);
                direction.x = Number(move.right) - Number(move.left);
                direction.normalize(); 

                if (move.forward || move.backward) velocity.z -= direction.z * 50.0 * delta;
                if (move.left || move.right) velocity.x -= direction.x * 50.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                // --- TRIGGER SỰ KIỆN KINH DỊ CHẠY NGẦM ---
                timeElapsed += delta;
                if(timeElapsed > 15 && !eventTriggered) {
                    eventTriggered = true;
                    addChat("[SERVER] Player 'John' has joined the game.", true);
                    document.getElementById('server-info').innerHTML = "Server: NA_CTF_01<br>Players: 2/8";
                    
                    setTimeout(() => {
                        addChat("John: I can see you.");
                        // Xuất hiện cái bóng đằng sau người chơi
                        const camDir = new THREE.Vector3();
                        camera.getWorldDirection(camDir);
                        ghost.position.copy(camera.position);
                        ghost.position.add(camDir.multiplyScalar(-15)); // Xuất hiện cách 15 unit đằng sau
                        ghost.position.y = 1.5;
                    }, 5000);

                    setTimeout(() => {
                        addChat("John: Turn around.");
                    }, 8000);
                }

                // Nếu người chơi nhìn thấy thực thể quá gần, nó sẽ biến mất (Glitch out)
                if(eventTriggered && ghost.position.y > 0) {
                    const dist = camera.position.distanceTo(ghost.position);
                    if(dist < 5) {
                        addChat("[SERVER] Player 'John' disconnected.", true);
                        document.getElementById('server-info').innerHTML = "Server: NA_CTF_01<br>Players: 1/8";
                        ghost.position.y = -10; // Biến mất
                        scene.background = new THREE.Color(0x330000); // Đổi map sang màu đỏ ám ảnh
                        scene.fog.color.setHex(0x330000);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            // Cập nhật lại tỷ lệ canvas giữ nguyên độ vỡ hạt
            renderer.setSize(window.innerWidth / 3, window.innerHeight / 3);
        });

        animate();
    </script>
</body>
</html>
