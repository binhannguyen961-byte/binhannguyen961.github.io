<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ka-50 Black Shark - Realistic Helicopter Simulator</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050a05;
            font-family: monospace;
            touch-action: none;
            user-select: none;
            color: #00ff66;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- BẢNG ĐIỀU KHIỂN BÊN TRONG BUỒNG LÁI (COCKPIT HUD) --- */
        #hud-top {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(10, 20, 10, 0.85);
            padding: 8px 12px;
            border: 1px solid #00ff66;
            border-radius: 4px;
            font-size: 11px;
            line-height: 1.5;
            z-index: 20;
            min-width: 200px;
        }

        /* Bảng nút khởi động thực tế (Startup Switch Panel) */
        #startup-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid #444;
            padding: 8px;
            border-radius: 6px;
            display: flex;
            gap: 6px;
            z-index: 20;
            flex-wrap: wrap;
            max-width: 200px;
        }

        .switch-btn {
            background: #222;
            color: #888;
            border: 1px solid #555;
            padding: 6px 8px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 3px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            flex: 1;
            min-width: 60px;
        }

        .switch-btn:hover {
            border-color: #777;
        }

        .switch-btn.active {
            background: #004400;
            color: #00ff66;
            border-color: #00ff66;
            box-shadow: 0 0 8px rgba(0,255,102,0.5);
        }

        .switch-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Nút Collective (Cần nâng hạ độ cao) */
        #collective-container {
            position: absolute;
            left: 15px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 20;
        }

        .coll-btn {
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ff66;
            color: #00ff66;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            user-select: none;
        }

        .coll-btn:active { 
            background: rgba(0, 255, 102, 0.3);
            transform: scale(0.95);
        }

        #collective-value {
            font-size: 9px;
            color: #00ff66;
            width: 60px;
            text-align: center;
        }

        /* Bảng nút chọn vũ khí & Bắn */
        #weapon-panel {
            position: absolute;
            bottom: 25px;
            right: 15px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            z-index: 20;
            flex-wrap: wrap-reverse;
            justify-content: flex-end;
        }

        .weapon-btn {
            width: 55px;
            height: 55px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #888;
            color: #aaa;
            font-size: 10px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .weapon-btn:hover {
            border-color: #aaa;
        }

        .weapon-btn.selected {
            border-color: #ffaa00;
            color: #ffaa00;
            background: rgba(255, 170, 0, 0.2);
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.4);
        }

        #fire-btn {
            width: 70px;
            height: 70px;
            background: rgba(180, 0, 0, 0.8);
            border: 2px solid #ff3333;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            user-select: none;
        }

        #fire-btn:active { 
            transform: scale(0.95);
            background: rgba(255, 51, 51, 1);
        }

        #fire-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Tâm ngắm HUD máy bay */
        #hud-sight {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border: 1px dashed rgba(0, 255, 102, 0.4);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }

        #hud-sight::before {
            content: ''; 
            position: absolute; 
            top: 50%; 
            left: 35%; 
            width: 30%; 
            height: 2px; 
            background: #00ff66;
            transform: translateY(-50%);
        }

        #hud-sight::after {
            content: '';
            position: absolute;
            top: 45%;
            left: 50%;
            width: 2px;
            height: 10%;
            background: #00ff66;
            transform: translateX(-50%);
        }

        #touch-area {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 5;
        }

        /* Info Panel */
        #info-panel {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(10, 20, 10, 0.85);
            padding: 8px 12px;
            border: 1px solid #00ff66;
            border-radius: 4px;
            font-size: 10px;
            line-height: 1.5;
            z-index: 20;
            max-width: 200px;
        }

        /* FPS Counter */
        #fps-counter {
            position: absolute;
            top: 10px;
            right: 150px;
            background: rgba(10, 20, 10, 0.85);
            padding: 6px 10px;
            border: 1px solid #00ff66;
            border-radius: 4px;
            font-size: 10px;
            z-index: 20;
        }

        @media (max-width: 768px) {
            #startup-panel {
                top: auto;
                bottom: 100px;
                right: auto;
                left: 10px;
                max-width: 150px;
            }

            #weapon-panel {
                bottom: auto;
                top: 50px;
                right: 10px;
            }

            #info-panel {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- HUD Thông số trực thăng Ka-50 -->
    <div id="hud-top">
        AIRCRAFT: Ka-50 "BLACK SHARK"<br>
        ALT: <span id="alt-txt">0</span> m | SPD: <span id="spd-txt">0</span> km/h<br>
        ROTOR: <span id="rpm-txt" style="color:#ff4444;">0%</span> | PITCH: <span id="pitch-txt">0°</span><br>
        ROLL: <span id="roll-txt">0°</span> | WPN: <span id="wpn-txt">NONE</span>
    </div>

    <!-- FPS Counter -->
    <div id="fps-counter">FPS: <span id="fps">60</span></div>

    <!-- Quy trình khởi động buồng lái (Realistic Startup Switches) -->
    <div id="startup-panel">
        <div class="switch-btn" id="sw-bat">BATT</div>
        <div class="switch-btn disabled" id="sw-apu">APU</div>
        <div class="switch-btn disabled" id="sw-eng">ENG</div>
        <div class="switch-btn disabled" id="sw-rotor">ROTOR</div>
    </div>

    <!-- Cần nâng Collective -->
    <div id="collective-container">
        <div class="coll-btn" id="coll-up">▲</div>
        <div style="font-size:9px; color:#00ff66;">COLLECTIVE</div>
        <div class="coll-btn" id="coll-down">▼</div>
        <div id="collective-value">0%</div>
    </div>

    <!-- Bảng vũ khí & Nút bắn -->
    <div id="weapon-panel">
        <button id="fire-btn" disabled>FIRE</button>
        <div class="weapon-btn selected" id="wpn-vikhr">VIKHR<br>ATGM</div>
        <div class="weapon-btn" id="wpn-s8">S-8<br>RKT</div>
        <div class="weapon-btn" id="wpn-gun">2A42<br>30mm</div>
    </div>

    <!-- Info Panel -->
    <div id="info-panel">
        CONTROLS:<br>
        <span style="color:#ffaa00;">Arrow Keys</span> - Pitch/Roll<br>
        <span style="color:#ffaa00;">W/S</span> - Collective<br>
        <span style="color:#ffaa00;">Touch</span> - Rotate View<br>
        <span style="color:#ffaa00;">1/2/3</span> - Select Weapon
    </div>

    <div id="hud-sight"></div>
    <div id="touch-area"></div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a120a);
        scene.fog = new THREE.FogExp2(0x0a120a, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // FPS Counter
        let frameCount = 0, lastTime = performance.now(), fps = 60;
        const fpsDisplay = document.getElementById('fps');

        // Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(30, 50, 30);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Địa hình chiến trường
        const floorGeo = new THREE.PlaneGeometry(500, 500, 32, 32);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1c2b1c, wireframe: true });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Đồ họa trực thăng Ka-50 đơn giản
        const heliGroup = new THREE.Group();
        scene.add(heliGroup);

        // Gắn Camera vào buồng lái pháo thủ/phi công Ka-50
        camera.position.set(0, 1.2, -0.5);
        heliGroup.add(camera);

        // Cánh quạt nâng nâng đồng trục (Coaxial Rotors) đặc trưng của Ka-50
        const rotorGroup1 = new THREE.Group();
        const rotorGroup2 = new THREE.Group();
        rotorGroup1.position.set(0, 2.2, 0);
        rotorGroup2.position.set(0, 2.6, 0);

        const bladeGeo = new THREE.BoxGeometry(0.2, 0.02, 6);
        const bladeMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
        
        const b1 = new THREE.Mesh(bladeGeo, bladeMat);
        const b2 = new THREE.Mesh(bladeGeo, bladeMat);
        b1.castShadow = true;
        b2.castShadow = true;
        rotorGroup1.add(b1);
        rotorGroup2.add(b2);
        heliGroup.add(rotorGroup1);
        heliGroup.add(rotorGroup2);

        // Trạng thái kỹ thuật & Khởi động
        let sysBattery = false, sysAPU = false, sysEngine = false, sysRotor = false;
        let rotorRPM = 0;
        let collective = 0;
        let altitude = 0;
        let speed = 0;

        // Weapon System
        let selectedWeapon = 'vikhr';
        const weapons = {
            vikhr: { name: 'VIKHR ATGM', ammo: 12 },
            s8: { name: 'S-8 Rocket', ammo: 80 },
            gun: { name: '2A42 30mm', ammo: 500 }
        };

        let collInput = 0;
        let keyInput = { pitch: 0, roll: 0 };

        // Xử lý các Switch Khởi Động
        const swBat = document.getElementById('sw-bat');
        const swApu = document.getElementById('sw-apu');
        const swEng = document.getElementById('sw-eng');
        const swRotor = document.getElementById('sw-rotor');

        function updateSwitchStates() {
            swApu.classList.toggle('disabled', !sysBattery);
            swEng.classList.toggle('disabled', !sysAPU);
            swRotor.classList.toggle('disabled', !sysEngine);
        }

        swBat.onclick = function() {
            sysBattery = !sysBattery;
            this.classList.toggle('active');
            if (!sysBattery) {
                sysAPU = false;
                sysEngine = false;
                sysRotor = false;
                rotorRPM = 0;
                collective = 0;
            }
            updateSwitchStates();
        };

        swApu.onclick = function() {
            if (sysBattery) {
                sysAPU = !sysAPU;
                this.classList.toggle('active');
                if (!sysAPU) {
                    sysEngine = false;
                    sysRotor = false;
                }
            }
            updateSwitchStates();
        };

        swEng.onclick = function() {
            if (sysAPU) {
                sysEngine = !sysEngine;
                this.classList.toggle('active');
                if (!sysEngine) sysRotor = false;
            }
            updateSwitchStates();
        };

        swRotor.onclick = function() {
            if (sysEngine) {
                sysRotor = !sysRotor;
                this.classList.toggle('active');
            }
            updateSwitchStates();
        };

        // Điều khiển Collective
        const collUp = document.getElementById('coll-up');
        const collDown = document.getElementById('coll-down');
        const fireBtn = document.getElementById('fire-btn');

        collUp.addEventListener('touchstart', (e) => { e.preventDefault(); collInput = 0.05; });
        collUp.addEventListener('touchend', () => { collInput = 0; });
        collDown.addEventListener('touchstart', (e) => { e.preventDefault(); collInput = -0.05; });
        collDown.addEventListener('touchend', () => { collInput = 0; });

        // Keyboard Controls
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            
            // Weapon selection
            if (e.key === '1') selectWeapon('vikhr');
            if (e.key === '2') selectWeapon('s8');
            if (e.key === '3') selectWeapon('gun');
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // Weapon Selection
        function selectWeapon(wpn) {
            selectedWeapon = wpn;
            document.querySelectorAll('.weapon-btn').forEach(btn => btn.classList.remove('selected'));
            document.getElementById('wpn-' + wpn).classList.add('selected');
            document.getElementById('wpn-txt').innerText = weapons[wpn].name;
            fireBtn.disabled = false;
        }

        document.getElementById('wpn-vikhr').onclick = () => selectWeapon('vikhr');
        document.getElementById('wpn-s8').onclick = () => selectWeapon('s8');
        document.getElementById('wpn-gun').onclick = () => selectWeapon('gun');

        fireBtn.onclick = () => {
            if (weapons[selectedWeapon] && weapons[selectedWeapon].ammo > 0) {
                weapons[selectedWeapon].ammo--;
                console.log(`Fired ${selectedWeapon}: ${weapons[selectedWeapon].ammo} left`);
            }
        };

        // Cảm ứng điều khiển pitch/roll
        let isTouching = false;
        let prevX = 0, prevY = 0;
        let targetPitch = 0, targetRoll = 0;

        const touchArea = document.getElementById('touch-area');
        touchArea.addEventListener('touchstart', (e) => {
            isTouching = true;
            prevX = e.touches[0].clientX;
            prevY = e.touches[0].clientY;
        });

        touchArea.addEventListener('touchmove', (e) => {
            if (!isTouching) return;
            const dx = e.touches[0].clientX - prevX;
            const dy = e.touches[0].clientY - prevY;

            targetRoll -= dx * 0.001;
            targetPitch += dy * 0.001;

            prevX = e.touches[0].clientX;
            prevY = e.touches[0].clientY;
        });

        touchArea.addEventListener('touchend', () => { isTouching = false; });

        // Game Loop & Vật lý trực thăng
        function animate() {
            requestAnimationFrame(animate);

            // Update keyboard input
            if (keys['arrowup']) targetPitch = Math.min(targetPitch + 0.02, Math.PI / 6);
            if (keys['arrowdown']) targetPitch = Math.max(targetPitch - 0.02, -Math.PI / 6);
            if (keys['arrowleft']) targetRoll = Math.min(targetRoll + 0.02, Math.PI / 6);
            if (keys['arrowright']) targetRoll = Math.max(targetRoll - 0.02, -Math.PI / 6);
            if (keys['w']) collInput = 0.05;
            if (keys['s']) collInput = -0.05;
            if (!keys['w'] && !keys['s']) collInput = 0;

            // Clamp rotations
            targetPitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, targetPitch));
            targetRoll = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, targetRoll));

            // Logic quay cánh quạt
            if (sysRotor) {
                if (rotorRPM < 100) rotorRPM += 0.5;
            } else {
                if (rotorRPM > 0) rotorRPM -= 0.3;
            }

            // Cánh quạt đồng trục xoay ngược chiều
            rotorGroup1.rotation.y += (rotorRPM / 100) * 0.4;
            rotorGroup2.rotation.y -= (rotorRPM / 100) * 0.4;

            // Tính toán lực nâng
            if (rotorRPM > 70) {
                collective = Math.max(0, Math.min(1, collective + collInput));
                const lift = (rotorRPM / 100) * collective * 0.15;
                
                heliGroup.position.y += lift - 0.05;
                if (heliGroup.position.y < 0) heliGroup.position.y = 0;

                // Áp dụng Pitch/Roll
                heliGroup.rotation.x = THREE.MathUtils.lerp(heliGroup.rotation.x, targetPitch, 0.08);
                heliGroup.rotation.z = THREE.MathUtils.lerp(heliGroup.rotation.z, targetRoll, 0.08);

                // Di chuyển
                speed = -heliGroup.rotation.x * 50;
                heliGroup.translateZ(-speed * 0.005);
            } else {
                heliGroup.rotation.x = THREE.MathUtils.lerp(heliGroup.rotation.x, 0, 0.05);
                heliGroup.rotation.z = THREE.MathUtils.lerp(heliGroup.rotation.z, 0, 0.05);
                targetPitch = 0;
                targetRoll = 0;
            }

            // Cập nhật HUD
            document.getElementById('rpm-txt').innerText = Math.round(rotorRPM) + "%";
            document.getElementById('rpm-txt').style.color = rotorRPM > 70 ? "#00ff66" : "#ff4444";
            document.getElementById('alt-txt').innerText = Math.round(heliGroup.position.y * 10);
            document.getElementById('spd-txt').innerText = Math.round(Math.abs(speed));
            document.getElementById('pitch-txt').innerText = Math.round(heliGroup.rotation.x * 57.3) + "°";
            document.getElementById('roll-txt').innerText = Math.round(heliGroup.rotation.z * 57.3) + "°";
            document.getElementById('collective-value').innerText = Math.round(collective * 100) + "%";

            // Update FPS
            frameCount++;
            const currentTime = performance.now();
            if (currentTime >= lastTime + 1000) {
                fps = frameCount;
                fpsDisplay.innerText = fps;
                frameCount = 0;
                lastTime = currentTime;
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
