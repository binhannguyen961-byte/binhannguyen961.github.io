<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tank Playtest - Mobile Gunner Role</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: monospace;
            touch-action: none; /* Ngăn trình duyệt tự động zoom/cuộn trên mobile */
        }
        /* Giao diện tâm ngắm pháo thủ */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80px;
            height: 80px;
            transform: translate(-50%, -50%);
            border: 2px dashed rgba(0, 255, 0, 0.6);
            border-radius: 50%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #crosshair::after {
            content: '';
            width: 6px;
            height: 6px;
            background-color: #00ff00;
            border-radius: 50%;
        }
        /* Bảng thông tin HUD */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #00ff00;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border: 1px solid #00ff00;
            border-radius: 4px;
            pointer-events: none;
            z-index: 10;
            font-size: 12px;
        }
        /* Giao diện các nút bấm ảo trên Mobile (Phong cách Cursed Tank Simulator) */
        .mobile-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 100;
        }
        .control-btn {
            width: 75px;
            height: 75px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ff00;
            border-radius: 50%;
            color: #00ff00;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            user-select: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
        }
        .control-btn:active {
            background: rgba(0, 255, 0, 0.3);
            transform: scale(0.95);
        }
        #fire-btn {
            background: rgba(139, 0, 0, 0.7);
            border-color: #ff4444;
            color: #ff4444;
        }
        #fire-btn:active {
            background: rgba(255, 0, 0, 0.4);
        }
        /* Khu vực cảm ứng vuốt màn hình để xoay tháp pháo */
        #touch-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <div id="hud">
        VAI TRÒ: PHÁO THỦ (GUNNER)<br>
        TRẠNG THÁI: Sẵn sàng chiến đấu<br>
        ĐIỀU KHIỂN: Vuốt màn hình để xoay tháp | Dùng nút bên phải để bắn/hướng
    </div>

    <div id="touch-area"></div>

    <!-- Cụm nút bấm ảo phong cách game mobile -->
    <div class="mobile-controls">
        <div class="control-btn" id="left-btn">QUAY<br>TRÁI</div>
        <div class="control-btn" id="right-btn">QUAY<br>PHẢI</div>
        <div class="control-btn" id="fire-btn">BẮN!<br>(FIRE)</div>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        // 1. Khởi tạo Scene, Camera & Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Ánh sáng chiến trường
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Sân chơi & các mục tiêu low-poly
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x3b4d3b, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const targets = [];
        for(let i = 0; i < 5; i++) {
            const targetGeo = new THREE.BoxGeometry(2, 1.5, 4);
            const targetMat = new THREE.MeshStandardMaterial({ color: 0x8b0000 });
            const target = new THREE.Mesh(targetGeo, targetMat);
            target.position.set((Math.random() - 0.5) * 30, 0.75, -20 - Math.random() * 20);
            scene.add(target);
            targets.push(target);
        }

        // Mô hình nòng pháo
        const turretGroup = new THREE.Group();
        scene.add(turretGroup);

        const barrelGeo = new THREE.CylinderGeometry(0.15, 0.15, 4, 8);
        barrelGeo.rotateX(Math.PI / 2);
        const barrelMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
        const barrel = new THREE.Mesh(barrelGeo, barrelMat);
        barrel.position.set(0, 0, -2);
        turretGroup.add(barrel);
        turretGroup.position.set(0, 1.5, 3);

        // Biến điều khiển góc xoay
        let targetRotationY = 0;
        let targetRotationX = 0;
        let turnDirection = 0; // -1: trái, 1: phải, 0: đứng yên

        // 2. Xử lý logic nút bấm ảo trên màn hình điện thoại
        const leftBtn = document.getElementById('left-btn');
        const rightBtn = document.getElementById('right-btn');
        const fireBtn = document.getElementById('fire-btn');

        // Giữ nút trái/phải để xoay tháp pháo liên tục
        leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); turnDirection = 1; });
        leftBtn.addEventListener('touchend', () => { turnDirection = 0; });
        leftBtn.addEventListener('mousedown', () => { turnDirection = 1; });
        leftBtn.addEventListener('mouseup', () => { turnDirection = 0; });

        rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); turnDirection = -1; });
        rightBtn.addEventListener('touchend', () => { turnDirection = 0; });
        rightBtn.addEventListener('mousedown', () => { turnDirection = -1; });
        rightBtn.addEventListener('mouseup', () => { turnDirection = 0; });

        // 3. Cơ chế bắn đạn
        function shootBullet() {
            const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            bullet.position.copy(turretGroup.position);
            
            const velocity = new THREE.Vector3(0, 0, -1);
            velocity.applyEuler(turretGroup.rotation);
            velocity.multiplyScalar(0.8);

            scene.add(bullet);
            bullets.push({ mesh: bullet, velocity: velocity, life: 100 });
        }

        fireBtn.addEventListener('click', shootBullet);
        fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); shootBullet(); });

        // Hỗ trợ kéo vuốt cảm ứng trên màn hình để thay đổi góc nhìn
        let isTouching = false;
        let prevTouchX = 0;
        let prevTouchY = 0;

        const touchArea = document.getElementById('touch-area');
        touchArea.addEventListener('touchstart', (e) => {
            isTouching = true;
            prevTouchX = e.touches[0].clientX;
            prevTouchY = e.touches[0].clientY;
        });

        touchArea.addEventListener('touchmove', (e) => {
            if (!isTouching) return;
            const deltaX = e.touches[0].clientX - prevTouchX;
            const deltaY = e.touches[0].clientY - prevTouchY;

            targetRotationY -= deltaX * 0.005;
            targetRotationX -= deltaY * 0.005;
            targetRotationX = Math.max(-0.2, Math.min(0.5, targetRotationX));

            prevTouchX = e.touches[0].clientX;
            prevTouchY = e.touches[0].clientY;
        });

        touchArea.addEventListener('touchend', () => { isTouching = false; });

        // Hỗ trợ chuột cho máy tính (phòng khi test trên PC)
        window.addEventListener('mousemove', (event) => {
            if(event.buttons === 1) { // Click giữ chuột trái để xoay nhìn
                targetRotationY -= event.movementX * 0.005;
                targetRotationX -= event.movementY * 0.005;
                targetRotationX = Math.max(-0.2, Math.min(0.5, targetRotationX));
            }
        });
        window.addEventListener('click', (e) => {
            if(e.target.tagName !== 'DIV' || e.target.id === 'touch-area') {
                // Click ngoài vùng nút bấm thì bắn
                // shootBullet();
            }
        });

        const bullets = [];

        // 4. Game Loop cập nhật khung hình liên tục
        function animate() {
            requestAnimationFrame(animate);

            // Xoay tháp pháo khi bấm nút ảo
            if (turnDirection !== 0) {
                targetRotationY += turnDirection * 0.03;
            }

            turretGroup.rotation.y = targetRotationY;
            barrel.rotation.x = targetRotationX;

            // Cập nhật vị trí đạn bay và kiểm tra va chạm mục tiêu
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.mesh.position.add(b.velocity);
                b.life--;

                for (let j = targets.length - 1; j >= 0; j--) {
                    const t = targets[j];
                    if (b.mesh.position.distanceTo(t.position) < 2) {
                        t.material.color.set(0x00ff00); // Trúng đạn chuyển sang xanh
                        scene.remove(b.mesh);
                        bullets.splice(i, 1);
                        break;
                    }
                }

                if (b.life <= 0 && bullets[i]) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        // Tự động điều chỉnh kích thước khi xoay màn hình điện thoại
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
