<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Factory Tycoon - Industrial Management Simulator</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050a05;
            font-family: monospace;
            touch-action: none;
            user-select: none;
            color: #00ff66;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- FACTORY DASHBOARD --- */
        #hud-top {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(10, 20, 10, 0.85);
            padding: 8px 12px;
            border: 1px solid #00ff66;
            border-radius: 4px;
            font-size: 11px;
            line-height: 1.5;
            z-index: 20;
            min-width: 250px;
        }

        /* Control Panel */
        #startup-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid #444;
            padding: 8px;
            border-radius: 6px;
            display: flex;
            gap: 6px;
            z-index: 20;
            flex-wrap: wrap;
            max-width: 220px;
        }

        .switch-btn {
            background: #222;
            color: #888;
            border: 1px solid #555;
            padding: 6px 8px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 3px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            flex: 1;
            min-width: 60px;
        }

        .switch-btn:hover {
            border-color: #777;
        }

        .switch-btn.active {
            background: #004400;
            color: #00ff66;
            border-color: #00ff66;
            box-shadow: 0 0 8px rgba(0,255,102,0.5);
        }

        .switch-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Production Control */
        #collective-container {
            position: absolute;
            left: 15px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 20;
        }

        .coll-btn {
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ff66;
            color: #00ff66;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            user-select: none;
        }

        .coll-btn:active { 
            background: rgba(0, 255, 102, 0.3);
            transform: scale(0.95);
        }

        #collective-value {
            font-size: 9px;
            color: #00ff66;
            width: 80px;
            text-align: center;
        }

        /* Product Selection Panel */
        #weapon-panel {
            position: absolute;
            bottom: 25px;
            right: 15px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            z-index: 20;
            flex-wrap: wrap-reverse;
            justify-content: flex-end;
        }

        .weapon-btn {
            width: 55px;
            height: 55px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #888;
            color: #aaa;
            font-size: 10px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .weapon-btn:hover {
            border-color: #aaa;
        }

        .weapon-btn.selected {
            border-color: #ffaa00;
            color: #ffaa00;
            background: rgba(255, 170, 0, 0.2);
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.4);
        }

        #fire-btn {
            width: 70px;
            height: 70px;
            background: rgba(0, 100, 0, 0.8);
            border: 2px solid #00ff66;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            user-select: none;
        }

        #fire-btn:active { 
            transform: scale(0.95);
            background: rgba(0, 200, 0, 1);
        }

        #fire-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* HUD Crosshair */
        #hud-sight {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border: 1px dashed rgba(0, 255, 102, 0.4);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }

        #hud-sight::before {
            content: ''; 
            position: absolute; 
            top: 50%; 
            left: 35%; 
            width: 30%; 
            height: 2px; 
            background: #00ff66;
            transform: translateY(-50%);
        }

        #hud-sight::after {
            content: '';
            position: absolute;
            top: 45%;
            left: 50%;
            width: 2px;
            height: 10%;
            background: #00ff66;
            transform: translateX(-50%);
        }

        #touch-area {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 5;
        }

        /* Info Panel */
        #info-panel {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(10, 20, 10, 0.85);
            padding: 8px 12px;
            border: 1px solid #00ff66;
            border-radius: 4px;
            font-size: 10px;
            line-height: 1.5;
            z-index: 20;
            max-width: 200px;
        }

        /* FPS Counter */
        #fps-counter {
            position: absolute;
            top: 10px;
            right: 150px;
            background: rgba(10, 20, 10, 0.85);
            padding: 6px 10px;
            border: 1px solid #00ff66;
            border-radius: 4px;
            font-size: 10px;
            z-index: 20;
        }

        @media (max-width: 768px) {
            #startup-panel {
                top: auto;
                bottom: 100px;
                right: auto;
                left: 10px;
                max-width: 150px;
            }

            #weapon-panel {
                bottom: auto;
                top: 50px;
                right: 10px;
            }

            #info-panel {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- FACTORY DASHBOARD -->
    <div id="hud-top">
        FACTORY: "INDUSTRIAL COMPLEX"<br>
        REVENUE: $<span id="alt-txt">0</span> | OUTPUT: <span id="spd-txt">0</span> units/h<br>
        EFFICIENCY: <span id="rpm-txt" style="color:#ff4444;">0%</span> | WORKFORCE: <span id="pitch-txt">0</span><br>
        POLLUTION: <span id="roll-txt">0%</span> | PRODUCT: <span id="wpn-txt">NONE</span>
    </div>

    <!-- FPS Counter -->
    <div id="fps-counter">FPS: <span id="fps">60</span></div>

    <!-- FACTORY STARTUP SEQUENCE -->
    <div id="startup-panel">
        <div class="switch-btn" id="sw-bat">POWER</div>
        <div class="switch-btn disabled" id="sw-apu">GRID</div>
        <div class="switch-btn disabled" id="sw-eng">LINES</div>
        <div class="switch-btn disabled" id="sw-rotor">RUN</div>
    </div>

    <!-- PRODUCTION RATE CONTROL -->
    <div id="collective-container">
        <div class="coll-btn" id="coll-up">▲</div>
        <div style="font-size:9px; color:#00ff66;">SPEED</div>
        <div class="coll-btn" id="coll-down">▼</div>
        <div id="collective-value">0%</div>
    </div>

    <!-- PRODUCT SELECTION & SELL -->
    <div id="weapon-panel">
        <button id="fire-btn" disabled>SELL</button>
        <div class="weapon-btn selected" id="wpn-vikhr">CPU<br>CHIPS</div>
        <div class="weapon-btn" id="wpn-s8">CIRCUIT<br>BOARDS</div>
        <div class="weapon-btn" id="wpn-gun">POWER<br>UNITS</div>
    </div>

    <!-- INFO PANEL -->
    <div id="info-panel">
        CONTROLS:<br>
        <span style="color:#ffaa00;">Arrow Keys</span> - Expand<br>
        <span style="color:#ffaa00;">W/S</span> - Speed<br>
        <span style="color:#ffaa00;">Touch</span> - Rotate<br>
        <span style="color:#ffaa00;">1/2/3</span> - Products
    </div>

    <div id="hud-sight"></div>
    <div id="touch-area"></div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a120a);
        scene.fog = new THREE.FogExp2(0x0a120a, 0.008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // FPS Counter
        let frameCount = 0, lastTime = performance.now(), fps = 60;
        const fpsDisplay = document.getElementById('fps');

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(50, 80, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Ground
        const floorGeo = new THREE.PlaneGeometry(800, 800, 32, 32);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a3f2a, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Main Factory Group
        const factoryGroup = new THREE.Group();
        scene.add(factoryGroup);

        // Camera positioned above factory
        camera.position.set(0, 40, 50);
        camera.lookAt(0, 20, 0);

        // Create Factory Buildings
        function createBuilding(x, z, w, d, h, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.6 });
            const building = new THREE.Mesh(geo, mat);
            building.position.set(x, h/2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            return building;
        }

        // Main Factory Building
        const mainBuilding = createBuilding(0, 0, 30, 20, 15, 0x444444);
        factoryGroup.add(mainBuilding);

        // Assembly Line 1
        const line1 = createBuilding(-25, -15, 15, 12, 8, 0x555555);
        factoryGroup.add(line1);

        // Assembly Line 2
        const line2 = createBuilding(25, -15, 15, 12, 8, 0x555555);
        factoryGroup.add(line2);

        // Storage Warehouse
        const warehouse = createBuilding(-40, 10, 20, 25, 12, 0x333333);
        factoryGroup.add(warehouse);

        // Power Plant
        const powerPlant = createBuilding(40, 10, 12, 12, 18, 0x663333);
        factoryGroup.add(powerPlant);

        // Factory Chimneys (Smoke indicators)
        function createChimney(x, z, height) {
            const geo = new THREE.CylinderGeometry(2, 2.5, height, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0x444444 });
            const chimney = new THREE.Mesh(geo, mat);
            chimney.position.set(x, height/2, z);
            chimney.castShadow = true;
            return chimney;
        }

        const chimney1 = createChimney(35, 15, 20);
        const chimney2 = createChimney(45, 15, 20);
        factoryGroup.add(chimney1);
        factoryGroup.add(chimney2);

        // Production status lights (on/off indicators)
        const statusLights = [];
        function createStatusLight(x, z, y = 3) {
            const light = new THREE.PointLight(0xff0000, 2, 30);
            light.position.set(x, y, z);
            factoryGroup.add(light);
            statusLights.push({ light: light, building: { x, z } });
            return light;
        }

        createStatusLight(-25, -15); // Line 1
        createStatusLight(25, -15);  // Line 2
        createStatusLight(40, 10);   // Power Plant

        // Game States
        let sysPower = false, sysGrid = false, sysLines = false, sysRun = false;
        let efficiency = 0;
        let revenue = 0;
        let workforce = 0;
        let pollution = 0;
        let production = 0;

        // Products System
        let selectedProduct = 'vikhr';
        const products = {
            vikhr: { name: 'CPU CHIPS', inventory: 0, price: 150 },
            s8: { name: 'CIRCUIT BOARDS', inventory: 0, price: 200 },
            gun: { name: 'POWER UNITS', inventory: 0, price: 250 }
        };

        let prodInput = 0;
        let cameraRotation = 0;

        // Switch Controls
        const swPower = document.getElementById('sw-bat');
        const swGrid = document.getElementById('sw-apu');
        const swLines = document.getElementById('sw-eng');
        const swRun = document.getElementById('sw-rotor');
        const sellBtn = document.getElementById('fire-btn');

        function updateSwitchStates() {
            swGrid.classList.toggle('disabled', !sysPower);
            swLines.classList.toggle('disabled', !sysGrid);
            swRun.classList.toggle('disabled', !sysLines);
        }

        swPower.onclick = function() {
            sysPower = !sysPower;
            this.classList.toggle('active');
            if (!sysPower) {
                sysGrid = false;
                sysLines = false;
                sysRun = false;
                efficiency = 0;
                production = 0;
            }
            updateSwitchStates();
        };

        swGrid.onclick = function() {
            if (sysPower) {
                sysGrid = !sysGrid;
                this.classList.toggle('active');
                if (!sysGrid) {
                    sysLines = false;
                    sysRun = false;
                }
            }
            updateSwitchStates();
        };

        swLines.onclick = function() {
            if (sysGrid) {
                sysLines = !sysLines;
                this.classList.toggle('active');
                if (!sysLines) sysRun = false;
            }
            updateSwitchStates();
        };

        swRun.onclick = function() {
            if (sysLines) {
                sysRun = !sysRun;
                this.classList.toggle('active');
            }
            updateSwitchStates();
        };

        // Production Controls
        const collUp = document.getElementById('coll-up');
        const collDown = document.getElementById('coll-down');

        collUp.addEventListener('touchstart', (e) => { e.preventDefault(); prodInput = 0.05; });
        collUp.addEventListener('touchend', () => { prodInput = 0; });
        collDown.addEventListener('touchstart', (e) => { e.preventDefault(); prodInput = -0.05; });
        collDown.addEventListener('touchend', () => { prodInput = 0; });

        // Keyboard Controls
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            
            if (e.key === '1') selectProduct('vikhr');
            if (e.key === '2') selectProduct('s8');
            if (e.key === '3') selectProduct('gun');
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // Product Selection
        function selectProduct(prod) {
            selectedProduct = prod;
            document.querySelectorAll('.weapon-btn').forEach(btn => btn.classList.remove('selected'));
            document.getElementById('wpn-' + prod).classList.add('selected');
            document.getElementById('wpn-txt').innerText = products[prod].name;
            sellBtn.disabled = false;
        }

        document.getElementById('wpn-vikhr').onclick = () => selectProduct('vikhr');
        document.getElementById('wpn-s8').onclick = () => selectProduct('s8');
        document.getElementById('wpn-gun').onclick = () => selectProduct('gun');

        sellBtn.onclick = () => {
            if (products[selectedProduct] && products[selectedProduct].inventory > 0) {
                const amount = Math.min(products[selectedProduct].inventory, 10);
                revenue += amount * products[selectedProduct].price;
                products[selectedProduct].inventory -= amount;
                console.log(`Sold ${amount} x ${selectedProduct}: Revenue +$${amount * products[selectedProduct].price}`);
            }
        };

        // Camera Touch Controls
        let isTouching = false;
        let prevX = 0, prevY = 0;
        let targetCameraY = 40;

        const touchArea = document.getElementById('touch-area');
        touchArea.addEventListener('touchstart', (e) => {
            isTouching = true;
            prevX = e.touches[0].clientX;
            prevY = e.touches[0].clientY;
        });

        touchArea.addEventListener('touchmove', (e) => {
            if (!isTouching) return;
            const dx = e.touches[0].clientX - prevX;
            const dy = e.touches[0].clientY - prevY;

            cameraRotation += dx * 0.005;
            targetCameraY = Math.max(20, Math.min(80, targetCameraY + dy * 0.1));

            prevX = e.touches[0].clientX;
            prevY = e.touches[0].clientY;
        });

        touchArea.addEventListener('touchend', () => { isTouching = false; });

        // Main Game Loop
        function animate() {
            requestAnimationFrame(animate);

            // Update keyboard input
            if (keys['arrowup']) targetCameraY = Math.min(targetCameraY + 1, 100);
            if (keys['arrowdown']) targetCameraY = Math.max(targetCameraY - 1, 20);
            if (keys['arrowleft']) cameraRotation += 0.02;
            if (keys['arrowright']) cameraRotation -= 0.02;
            if (keys['w']) prodInput = 0.05;
            if (keys['s']) prodInput = -0.05;
            if (!keys['w'] && !keys['s']) prodInput = 0;

            // Update camera position (orbital)
            const radius = 60;
            camera.position.x = Math.sin(cameraRotation) * radius;
            camera.position.y = targetCameraY;
            camera.position.z = Math.cos(cameraRotation) * radius;
            camera.lookAt(0, 20, 0);

            // Production Logic
            if (sysRun) {
                if (efficiency < 100) efficiency += 0.8;
                workforce = Math.floor(50 + efficiency * 0.5);
                pollution = efficiency * 0.8;

                // Produce goods
                efficiency = Math.max(0, Math.min(1, efficiency + prodInput));
                const prodRate = (efficiency / 100) * 5;
                products[selectedProduct].inventory += prodRate;

                // Update status lights - green when running
                statusLights.forEach(sl => {
                    sl.light.color.setHex(0x00ff00);
                });
            } else {
                if (efficiency > 0) efficiency -= 0.3;
                statusLights.forEach(sl => {
                    sl.light.color.setHex(0xff0000);
                });
            }

            // Clamp efficiency
            efficiency = Math.max(0, Math.min(100, efficiency));

            // Environmental Impact
            if (sysRun) {
                pollution = Math.min(100, pollution + efficiency * 0.1);
            } else {
                pollution = Math.max(0, pollution - 0.2);
            }

            // Update HUD Display
            document.getElementById('rpm-txt').innerText = Math.round(efficiency) + "%";
            document.getElementById('rpm-txt').style.color = efficiency > 70 ? "#00ff66" : "#ff4444";
            document.getElementById('alt-txt').innerText = Math.round(revenue);
            document.getElementById('spd-txt').innerText = Math.round(efficiency * 100);
            document.getElementById('pitch-txt').innerText = workforce;
            document.getElementById('roll-txt').innerText = Math.round(pollution) + "%";
            document.getElementById('collective-value').innerText = Math.round(efficiency) + "%";

            // Update FPS
            frameCount++;
            const currentTime = performance.now();
            if (currentTime >= lastTime + 1000) {
                fps = frameCount;
                fpsDisplay.innerText = fps;
                frameCount = 0;
                lastTime = currentTime;
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
