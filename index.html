<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Su-30MK2 Flanker vs F-16 Dogfight Simulator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
            touch-action: none;
            user-select: none;
            color: #00ff66;
        }

        /* --- JET HUD DISPLAY --- */
        #hud-top {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 15, 0, 0.75);
            padding: 8px 12px;
            border: 1px solid #00ff66;
            border-radius: 4px;
            font-size: 11px;
            line-height: 1.5;
            z-index: 20;
            pointer-events: none;
        }

        /* Khung radar chỉ báo kẻ thù */
        #radar-box {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 100px;
            height: 100px;
            border: 1px solid #00ff66;
            background: rgba(0, 20, 0, 0.6);
            border-radius: 50%;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* Tâm ngắm HUD tiêm kích */
        #hud-reticle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 140px;
            border: 1px solid rgba(0, 255, 102, 0.3);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        #hud-reticle::before {
            content: ''; position: absolute; top: 50%; left: 20%; width: 60%; height: 2px; background: #00ff66;
        }

        /* Cần gạt Throttle / Đốt sau (Afterburner) */
        #throttle-container {
            position: absolute;
            left: 15px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 20;
        }
        .throt-btn {
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ff66;
            color: #00ff66;
            font-weight: bold;
            font-size: 14px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .throt-btn:active { background: rgba(0, 255, 102, 0.3); }

        /* Bảng chọn vũ khí & Nút bắn */
        #weapon-panel {
            position: absolute;
            bottom: 25px;
            right: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 20;
        }
        .weapon-btn {
            width: 55px;
            height: 55px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #888;
            color: #aaa;
            font-size: 10px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .weapon-btn.selected {
            border-color: #00ff66;
            color: #00ff66;
            background: rgba(0, 255, 102, 0.2);
        }
        #fire-btn {
            width: 70px;
            height: 70px;
            background: rgba(180, 0, 0, 0.85);
            border: 2px solid #ff3333;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #fire-btn:active { transform: scale(0.95); }

        #touch-area {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; z-index: 5;
        }
    </style>
</head>
<body>

    <!-- HUD Thông số Su-30MK2 -->
    <div id="hud-top">
        AIRCRAFT: Su-30MK2 FLANKER-G+<br>
        SPEED: <span id="spd-txt">0</span> km/h (M <span id="mach-txt">0.0</span>)<br>
        ALTITUDE: <span id="alt-txt">0</span> m | THROTTLE: <span id="throt-txt">50%</span><br>
        TARGET LOCK: <span id="target-txt" style="color:#ff4444;">SEARCHING...</span>
    </div>

    <!-- Khung Radar thu nhỏ -->
    <div id="radar-box">
        <div style="font-size: 8px; position: absolute; top: 4px; color: #00ff66;">RADAR 20KM</div>
    </div>

    <!-- Cần ga Throttle -->
    <div id="throttle-container">
        <div class="throt-btn" id="throt-up">▲</div>
        <div style="font-size:8px; color:#00ff66;">THROTTLE</div>
        <div class="throt-btn" id="throt-dn">▼</div>
    </div>

    <!-- Bảng vũ khí Không Đối Không -->
    <div id="weapon-panel">
        <div class="weapon-btn selected" id="wpn-r73">R-73<br>AAM</div>
        <div class="weapon-btn" id="wpn-gun">GSh-30-1<br>30mm</div>
        <div id="fire-btn">FOX 2</div>
    </div>

    <div id="hud-reticle"></div>
    <div id="touch-area"></div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x4a75a0); // Bầu trời
        scene.fog = new THREE.FogExp2(0x4a75a0, 0.0005);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(100, 300, 100);
        scene.add(dirLight);

        // Mặt đất / Mây
        const floorGeo = new THREE.PlaneGeometry(10000, 10000, 16, 16);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x223311, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Máy bay Su-30MK2 (Người chơi)
        const playerJet = new THREE.Group();
        playerJet.position.set(0, 1000, 0);
        scene.add(playerJet);

        // Gắn Camera vào buồng lái Su-30MK2
        camera.position.set(0, 1.2, -0.5);
        playerJet.add(camera);

        // Tạo Bot AI F-16 Falcon
        const botJets = [];
        function createF16(x, y, z) {
            const f16Group = new THREE.Group();
            f16Group.position.set(x, y, z);

            // Mô hình F-16 đơn giản
            const bodyGeo = new THREE.ConeGeometry(1.5, 8, 5);
            bodyGeo.rotateX(Math.PI / 2);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x778899 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            f16Group.add(body);

            const wingGeo = new THREE.BoxGeometry(7, 0.1, 3);
            const wing = new THREE.Mesh(wingGeo, bodyMat);
            wing.position.set(0, 0, 1);
            f16Group.add(wing);

            scene.add(f16Group);
            botJets.push({ mesh: f16Group, hp: 100, speed: 2.2 });
        }

        // Tạo 3 tiêm kích F-16 làm đối thủ
        createF16(100, 1000, -800);
        createF16(-300, 1200, -1200);
        createF16(400, 900, -1500);

        // Thông số bay của Su-30MK2
        let throttle = 50; // % công suất động cơ
        let currentSpeed = 2.5;
        let pitchRate = 0, rollRate = 0;

        // Xử lý Cần ga Throttle
        const throtUp = document.getElementById('throt-up');
        const throtDn = document.getElementById('throt-dn');
        throtUp.onclick = () => { throttle = Math.min(100, throttle + 10); };
        throtDn.onclick = () => { throttle = Math.max(20, throttle - 10); };

        // Điều khiển vuốt màn hình (Pitch & Roll)
        let isTouching = false;
        let prevX = 0, prevY = 0;

        const touchArea = document.getElementById('touch-area');
        touchArea.addEventListener('touchstart', (e) => {
            isTouching = true;
            prevX = e.touches[0].clientX;
            prevY = e.touches[0].clientY;
        });

        touchArea.addEventListener('touchmove', (e) => {
            if (!isTouching) return;
            const dx = e.touches[0].clientX - prevX;
            const dy = e.touches[0].clientY - prevY;

            rollRate = -dx * 0.0008;
            pitchRate = -dy * 0.0008;

            prevX = e.touches[0].clientX;
            prevY = e.touches[0].clientY;
        });

        touchArea.addEventListener('touchend', () => { 
            isTouching = false; 
            pitchRate = 0; rollRate = 0;
        });

        // Tên lửa đuổi & Đạn pháo
        const missiles = [];
        const fireBtn = document.getElementById('fire-btn');

        function launchR73() {
            const mGeo = new THREE.CylinderGeometry(0.1, 0.1, 2, 8);
            mGeo.rotateX(Math.PI / 2);
            const mMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            const missile = new THREE.Mesh(mGeo, mMat);

            missile.position.copy(playerJet.position);
            missile.quaternion.copy(playerJet.quaternion);

            scene.add(missile);
            missiles.push({ mesh: missile, life: 300, speed: 5.0 });
        }

        fireBtn.addEventListener('click', launchR73);
        fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); launchR73(); });

        // Game Loop
        function animate() {
            requestAnimationFrame(animate);

            // Cập nhật tốc độ theo Throttle
            currentSpeed = THREE.MathUtils.lerp(currentSpeed, (throttle / 100) * 4.5, 0.02);

            // Điều khiển bay cho Su-30MK2
            playerJet.rotateX(pitchRate);
            playerJet.rotateZ(rollRate);
            playerJet.translateZ(-currentSpeed);

            // Giới hạn độ cao không đâm đất
            if (playerJet.position.y < 10) playerJet.position.y = 10;

            // Cập nhật AI Bot F-16
            let nearestBot = null;
            let minDist = 9999;

            botJets.forEach(bot => {
                // F-16 lượn né đạn và duy trì di chuyển
                bot.mesh.translateZ(-bot.speed);
                bot.mesh.rotation.y += 0.005;

                const dist = playerJet.position.distanceTo(bot.mesh.position);
                if (dist < minDist) {
                    minDist = dist;
                    nearestBot = bot;
                }
            });

            // Cập nhật Tên lửa tầm nhiệt đuổi F-16
            for (let i = missiles.length - 1; i >= 0; i--) {
                const m = missiles[i];
                m.mesh.translateZ(-m.speed);
                m.life--;

                // Tên lửa tự tìm đến F-16 gần nhất
                if (nearestBot) {
                    m.mesh.lookAt(nearestBot.mesh.position);
                }

                // Va chạm nổ mục tiêu
                if (nearestBot && m.mesh.position.distanceTo(nearestBot.mesh.position) < 15) {
                    scene.remove(nearestBot.mesh);
                    botJets.splice(botJets.indexOf(nearestBot), 1);
                    scene.remove(m.mesh);
                    missiles.splice(i, 1);
                    break;
                }

                if (m.life <= 0 && missiles[i]) {
                    scene.remove(m.mesh);
                    missiles.splice(i, 1);
                }
            }

            // Cập nhật HUD Thông số Su-30MK2
            const speedKmh = Math.round(currentSpeed * 220);
            document.getElementById('spd-txt').innerText = speedKmh;
            document.getElementById('mach-txt').innerText = (speedKmh / 1225).toFixed(2);
            document.getElementById('alt-txt').innerText = Math.round(playerJet.position.y);
            document.getElementById('throt-txt').innerText = throttle + "%";

            if (nearestBot && minDist < 2000) {
                document.getElementById('target-txt').innerText = "LOCK F-16 (" + Math.round(minDist) + "m)";
                document.getElementById('target-txt').style.color = "#00ff66";
            } else {
                document.getElementById('target-txt').innerText = "SEARCHING...";
                document.getElementById('target-txt').style.color = "#ff4444";
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
