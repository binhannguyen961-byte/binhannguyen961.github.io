<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Player Online - Haunted Multiplayer Server</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier Prime', monospace;
            color: #00ff00;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Main Canvas */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
        }

        /* CRT Scan Lines Overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 100;
            opacity: 0.4;
        }

        /* Vignette Effect */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.4) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* Menu Screen */
        #menu-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.97; }
        }

        #menu-screen h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 20px #00ff00, 0 0 40px rgba(0, 255, 0, 0.5);
        }

        #menu-screen .subtitle {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: #00aa00;
            text-shadow: 0 0 5px #00ff00;
        }

        .server-list {
            width: 600px;
            max-height: 300px;
            border: 2px solid #00ff00;
            background: #001100;
            padding: 20px;
            margin-bottom: 30px;
            overflow-y: auto;
        }

        .server-item {
            padding: 10px;
            margin: 5px 0;
            border-left: 3px solid #00ff00;
            cursor: pointer;
            transition: background 0.2s;
        }

        .server-item:hover {
            background: rgba(0, 255, 0, 0.1);
        }

        .server-item.selected {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .server-name {
            font-weight: bold;
            color: #00ff00;
        }

        .server-info {
            font-size: 0.9rem;
            color: #00aa00;
            margin-top: 3px;
        }

        #join-button {
            padding: 12px 40px;
            font-size: 1.2rem;
            background: none;
            border: 2px solid #00ff00;
            color: #00ff00;
            cursor: pointer;
            font-family: 'Courier Prime', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
            text-shadow: 0 0 10px #00ff00;
            font-weight: bold;
        }

        #join-button:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 20px #00ff00;
        }

        #join-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* In-Game HUD */
        #hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 50;
            pointer-events: none;
        }

        #hud.active {
            display: block;
        }

        /* Top HUD - Server Info */
        #top-hud {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 30, 0, 0.8);
            border: 2px solid #00ff00;
            padding: 10px;
            font-size: 0.9rem;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
            z-index: 51;
            min-width: 300px;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.1);
        }

        #server-status {
            margin-bottom: 5px;
        }

        #player-count {
            color: #00aa00;
        }

        #current-map {
            margin-top: 5px;
            font-size: 0.85rem;
            color: #00aa00;
        }

        /* Chat Console */
        #chat-console {
            position: absolute;
            bottom: 120px;
            left: 10px;
            background: rgba(0, 30, 0, 0.9);
            border: 2px solid #00ff00;
            padding: 8px;
            width: 500px;
            height: 200px;
            overflow-y: auto;
            font-size: 0.85rem;
            color: #00ff00;
            text-shadow: 0 0 3px #00ff00;
            z-index: 51;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.1);
        }

        .chat-message {
            margin-bottom: 3px;
            padding: 2px 0;
            border-left: 2px solid transparent;
            padding-left: 5px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .chat-message.system {
            color: #ff0000;
            border-left-color: #ff0000;
            text-shadow: 0 0 5px #ff0000;
        }

        .chat-message.player {
            color: #ffff00;
            border-left-color: #ffff00;
        }

        .chat-message.warning {
            color: #ff6600;
            border-left-color: #ff6600;
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .chat-message.ghost {
            color: #ff00ff;
            border-left-color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            animation: glitch 0.3s;
        }

        @keyframes glitch {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            z-index: 51;
            pointer-events: none;
        }

        .crosshair-dot {
            width: 2px;
            height: 2px;
            background: #00ff00;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 5px #00ff00;
        }

        .crosshair-line {
            position: absolute;
            background: #00ff00;
            opacity: 0.6;
        }

        .crosshair-h {
            width: 15px;
            height: 1px;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
        }

        .crosshair-v {
            width: 1px;
            height: 15px;
            top: 50%;
            left: 50%;
            transform: translateY(-50%);
        }

        /* Weapon/Item Panel */
        #weapon-panel {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 30, 0, 0.8);
            border: 2px solid #00ff00;
            padding: 10px;
            z-index: 51;
            min-width: 200px;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.1);
        }

        #current-weapon {
            color: #ffff00;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 0 0 5px #ffff00;
        }

        #ammo-display {
            color: #00ff00;
            font-size: 0.9rem;
        }

        /* Radar/Minimap */
        #radar {
            position: absolute;
            bottom: 15px;
            left: 520px;
            width: 150px;
            height: 150px;
            background: rgba(0, 30, 0, 0.8);
            border: 2px solid #00ff00;
            z-index: 51;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.1);
        }

        #radar-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Glitch Effect */
        .glitch-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.05);
            pointer-events: none;
            z-index: 90;
            display: none;
            animation: glitchScreen 0.1s infinite;
        }

        @keyframes glitchScreen {
            0% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            50% { transform: translateX(2px); }
            75% { transform: translateX(-2px); }
            100% { transform: translateX(0); }
        }

        #menu-screen.hidden {
            display: none;
        }

        /* Spectator Mode Indicator */
        #spectator-notice {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            color: #ff0000;
            text-shadow: 0 0 30px #ff0000;
            display: none;
            z-index: 95;
            animation: pulse 1s infinite;
            text-align: center;
        }

        /* Key Pickup Notification */
        #key-notification {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 165, 0, 0.9);
            border: 3px solid #ff8800;
            padding: 20px;
            color: #000;
            font-weight: bold;
            font-size: 1.2rem;
            display: none;
            z-index: 52;
            text-shadow: none;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translate(-50%, -100px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%);
                opacity: 1;
            }
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="glitch-screen" id="glitch"></div>

    <!-- Menu Screen -->
    <div id="menu-screen">
        <h1>HALF-LIFE: NO PLAYER ONLINE</h1>
        <div class="subtitle">A "Haunted Multiplayer Server" Experience</div>
        
        <div class="server-list" id="server-list">
            <!-- Servers populated by JS -->
        </div>

        <button id="join-button">JOIN SERVER</button>
    </div>

    <!-- In-Game HUD -->
    <div id="hud">
        <div id="top-hud">
            <div id="server-status">
                Server: <span id="server-name">NA_CTF_01</span>
            </div>
            <div id="player-count">
                Players: <span id="players">1</span>/<span id="max-players">8</span>
            </div>
            <div id="current-map">
                Map: <span id="map-name">ctf_empty</span>
            </div>
        </div>

        <div id="chat-console"></div>

        <div id="radar">
            <canvas id="radar-canvas" width="150" height="150"></canvas>
        </div>

        <div id="weapon-panel">
            <div id="current-weapon">Crowbar</div>
            <div id="ammo-display">Ammo: ∞</div>
        </div>

        <div id="crosshair">
            <div class="crosshair-dot"></div>
            <div class="crosshair-line crosshair-h"></div>
            <div class="crosshair-line crosshair-v"></div>
        </div>

        <div id="spectator-notice">YOU ARE IN SPECTATOR MODE</div>
        <div id="key-notification"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // ============================================
        // GAME STATE & CONFIG
        // ============================================
        const gameState = {
            isPlaying: false,
            currentMap: 'ctf_empty',
            playerCount: 1,
            maxPlayers: 8,
            hasRedKey: false,
            hasBlueKey: false,
            isSpectator: false,
            timeElapsed: 0,
            ghostsSpotted: 0,
            receivedMessages: 0
        };

        const mapData = {
            ctf_empty: {
                name: 'ctf_empty',
                displayName: 'ctf_empty_server',
                description: 'A deserted Capture The Flag arena'
            },
            c_map1: {
                name: 'c_map1',
                displayName: 'c_map1',
                description: 'Industrial Complex'
            }
        };

        // ============================================
        // THREE.JS SETUP
        // ============================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.FogExp2(0x0a0a0a, 0.015);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 1.6;

        const canvas = document.getElementById('game-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowShadowMap;
        renderer.setPixelRatio(1);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x888888, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(100, 100, 100);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.far = 500;
        directionalLight.shadow.camera.left = -250;
        directionalLight.shadow.camera.right = 250;
        directionalLight.shadow.camera.top = 250;
        directionalLight.shadow.camera.bottom = -250;
        scene.add(directionalLight);

        // ============================================
        // LEVEL BUILDER
        // ============================================
        function createCTFEmptyMap() {
            // Floor
            const floorGeo = new THREE.PlaneGeometry(200, 200);
            const floorMat = new THREE.MeshStandardMaterial({
                color: 0x222222,
                roughness: 0.9,
                metalness: 0.1
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            floor.position.y = 0;
            scene.add(floor);

            // Walls and structures
            const wallMat = new THREE.MeshStandardMaterial({
                color: 0x3a3a3a,
                roughness: 0.8
            });

            // Main walls
            const walls = [
                { pos: [0, 0, -80], size: [200, 20, 5] },
                { pos: [0, 0, 80], size: [200, 20, 5] },
                { pos: [-80, 0, 0], size: [5, 20, 200] },
                { pos: [80, 0, 0], size: [5, 20, 200] }
            ];

            walls.forEach(wall => {
                const geo = new THREE.BoxGeometry(...wall.size);
                const mesh = new THREE.Mesh(geo, wallMat);
                mesh.position.set(...wall.pos);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
            });

            // CTF Flags
            const flagPole1 = createFlagPole(50, 10, 'red');
            const flagPole2 = createFlagPole(-50, -10, 'blue');
            scene.add(flagPole1);
            scene.add(flagPole2);

            // Boxes and obstacles
            const boxMat = new THREE.MeshStandardMaterial({
                color: 0x555555,
                roughness: 0.7
            });

            const boxes = [
                [30, 0, 30], [-30, 0, -30], [30, 0, -30], [-30, 0, 30],
                [0, 0, 50], [0, 0, -50], [50, 0, 0], [-50, 0, 0]
            ];

            boxes.forEach(pos => {
                const geo = new THREE.BoxGeometry(15, 15, 15);
                const mesh = new THREE.Mesh(geo, boxMat);
                mesh.position.set(...pos);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
            });

            // Pillars
            const pillarMat = new THREE.MeshStandardMaterial({
                color: 0x404040,
                roughness: 0.9
            });

            const pillars = [[40, 0, 40], [-40, 0, -40], [40, 0, -40], [-40, 0, 40]];
            pillars.forEach(pos => {
                const geo = new THREE.CylinderGeometry(3, 3, 20, 16);
                const mesh = new THREE.Mesh(geo, pillarMat);
                mesh.position.set(...pos);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
            });
        }

        function createFlagPole(x, z, color) {
            const group = new THREE.Group();
            const poleGeo = new THREE.CylinderGeometry(1, 1, 15, 8);
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.castShadow = true;
            group.add(pole);

            const flagColor = color === 'red' ? 0xff0000 : 0x0000ff;
            const flagGeo = new THREE.PlaneGeometry(8, 5);
            const flagMat = new THREE.MeshStandardMaterial({ color: flagColor });
            const flag = new THREE.Mesh(flagGeo, flagMat);
            flag.position.set(5, 5, 0);
            flag.castShadow = true;
            group.add(flag);

            group.position.set(x, 7.5, z);
            return group;
        }

        createCTFEmptyMap();

        // ============================================
        // PLAYER CONTROLS
        // ============================================
        const controls = new PointerLockControls(camera, document.body);
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const keys = {};

        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        controls.addEventListener('lock', () => {
            gameState.isPlaying = true;
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('hud').classList.add('active');
        });

        controls.addEventListener('unlock', () => {
            gameState.isPlaying = false;
            document.getElementById('menu-screen').classList.remove('hidden');
            document.getElementById('hud').classList.remove('active');
        });

        // ============================================
        // CHAT SYSTEM
        // ============================================
        const chatConsole = document.getElementById('chat-console');

        function addChatMessage(text, type = 'system') {
            const msg = document.createElement('div');
            msg.className = `chat-message ${type}`;
            msg.textContent = text;
            chatConsole.appendChild(msg);
            chatConsole.scrollTop = chatConsole.scrollHeight;

            if (chatConsole.children.length > 50) {
                chatConsole.removeChild(chatConsole.children[0]);
            }
        }

        // ============================================
        // EVENT SYSTEM (HORROR ELEMENTS)
        // ============================================
        const eventTimeline = [];

        function scheduleEvent(delay, callback) {
            eventTimeline.push({
                trigger: delay,
                callback: callback,
                triggered: false
            });
        }

        // Initial connection message
        scheduleEvent(1, () => {
            addChatMessage('[SERVER] Welcome to ' + mapData[gameState.currentMap].displayName, 'system');
            addChatMessage('[SERVER] Players online: 1/8', 'system');
        });

        // First weird event - footsteps
        scheduleEvent(8, () => {
            addChatMessage('[SERVER] *distant footsteps echo*', 'system');
            playSound('footstep', 0.3);
        });

        // Player joins
        scheduleEvent(15, () => {
            addChatMessage('[SERVER] Player "john_doe" joined the game', 'system');
            updatePlayerCount(2);
            playSound('join', 0.4);
        });

        // Chat from ghost player
        scheduleEvent(20, () => {
            addChatMessage('john_doe: hello?', 'player');
        });

        scheduleEvent(25, () => {
            addChatMessage('john_doe: can you hear me?', 'player');
        });

        // Eerie message
        scheduleEvent(32, () => {
            addChatMessage('[SERVER] *voice message received*', 'warning');
            playSound('static', 0.5);
        });

        scheduleEvent(33, () => {
            addChatMessage('john_doe: i can see you', 'ghost');
            glitchScreen();
        });

        // Player count fluctuation
        scheduleEvent(40, () => {
            updatePlayerCount(3);
            addChatMessage('[SERVER] 2 more players joined', 'system');
        });

        scheduleEvent(42, () => {
            updatePlayerCount(1);
            addChatMessage('[SERVER] Players disconnected unexpectedly', 'system');
        });

        // Spooky event - objects moving
        scheduleEvent(50, () => {
            addChatMessage('[SERVER] *sounds of objects being moved*', 'system');
            playSound('crash', 0.6);
            glitchScreen();
        });

        // Reality distortion
        scheduleEvent(65, () => {
            addChatMessage('[SERVER] [SYSTEM MALFUNCTION]', 'warning');
            addChatMessage('john_doe: turn around', 'ghost');
            glitchScreen();
            enableSpectatorMode();
            playSound('static', 0.7);
        });

        // The final message
        scheduleEvent(75, () => {
            addChatMessage('[SERVER] ??? : you are not alone', 'ghost');
            glitchScreen();
            playSound('scream', 0.8);
        });

        // Loop detection
        scheduleEvent(90, () => {
            addChatMessage('[SERVER] Connection reset by administrator', 'system');
            addChatMessage('[SERVER] Rejoining...', 'system');
            resetGame();
        });

        function updatePlayerCount(count) {
            gameState.playerCount = count;
            document.getElementById('players').textContent = count;
            document.getElementById('player-count').style.color = count > 1 ? '#ff6600' : '#00ff00';
        }

        // ============================================
        // AUDIO SYSTEM
        // ============================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type, volume = 0.3) {
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                gain.gain.setValueAtTime(volume, now);

                switch (type) {
                    case 'footstep':
                        osc.frequency.setValueAtTime(80, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                        osc.start(now);
                        osc.stop(now + 0.2);
                        break;
                    case 'join':
                        osc.frequency.setValueAtTime(600, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                        osc.start(now);
                        osc.stop(now + 0.1);
                        break;
                    case 'static':
                        const bufferSize = audioCtx.sampleRate * 0.5;
                        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                        const data = buffer.getChannelData(0);
                        for (let i = 0; i < bufferSize; i++) {
                            data[i] = Math.random() * 2 - 1;
                        }
                        const source = audioCtx.createBufferSource();
                        source.buffer = buffer;
                        source.connect(gain);
                        source.start(now);
                        source.stop(now + 0.3);
                        break;
                    case 'crash':
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(50, now + 0.4);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                        osc.start(now);
                        osc.stop(now + 0.4);
                        break;
                    case 'scream':
                        osc.frequency.setValueAtTime(300, now);
                        osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                        osc.start(now);
                        osc.stop(now + 0.3);
                        break;
                }
            } catch (e) {
                console.log('Audio unavailable');
            }
        }

        // ============================================
        // VISUAL EFFECTS
        // ============================================
        function glitchScreen() {
            const glitch = document.getElementById('glitch');
            glitch.style.display = 'block';
            glitch.style.animation = 'none';
            setTimeout(() => {
                glitch.style.animation = 'glitchScreen 0.1s infinite';
            }, 10);
            setTimeout(() => {
                glitch.style.display = 'none';
            }, 300);
        }

        function enableSpectatorMode() {
            gameState.isSpectator = true;
            document.getElementById('spectator-notice').style.display = 'block';
            scene.background = new THREE.Color(0x330000);
            scene.fog.color.setHex(0x330000);
        }

        function disableSpectatorMode() {
            gameState.isSpectator = false;
            document.getElementById('spectator-notice').style.display = 'none';
            scene.background = new THREE.Color(0x0a0a0a);
            scene.fog.color.setHex(0x0a0a0a);
        }

        // ============================================
        // RADAR SYSTEM
        // ============================================
        const radarCanvas = document.getElementById('radar-canvas');
        const radarCtx = radarCanvas.getContext('2d');

        function drawRadar() {
            radarCtx.fillStyle = '#001100';
            radarCtx.fillRect(0, 0, 150, 150);

            radarCtx.strokeStyle = '#00ff00';
            radarCtx.lineWidth = 1;
            radarCtx.beginPath();
            radarCtx.arc(75, 75, 70, 0, Math.PI * 2);
            radarCtx.stroke();

            // Player position
            radarCtx.fillStyle = '#00ff00';
            radarCtx.fillRect(73, 73, 4, 4);

            // Direction indicator
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            const angle = Math.atan2(dir.x, dir.z);
            const endX = 75 + Math.sin(angle) * 30;
            const endY = 75 + Math.cos(angle) * 30;
            radarCtx.strokeStyle = '#ffff00';
            radarCtx.lineWidth = 2;
            radarCtx.beginPath();
            radarCtx.moveTo(75, 75);
            radarCtx.lineTo(endX, endY);
            radarCtx.stroke();
        }

        // ============================================
        // GAME RESET
        // ============================================
        function resetGame() {
            gameState.timeElapsed = 0;
            gameState.playerCount = 1;
            gameState.isSpectator = false;
            disableSpectatorMode();
            chatConsole.innerHTML = '';
            eventTimeline.forEach(evt => evt.triggered = false);
        }

        // ============================================
        // SERVER MENU
        // ============================================
        const menuScreen = document.getElementById('menu-screen');
        const serverList = document.getElementById('server-list');
        const joinButton = document.getElementById('join-button');

        const servers = [
            { name: 'NA_CTF_01', map: 'ctf_empty', players: '1/8', desc: 'Capture The Flag - Empty' },
            { name: 'EU_DEATHMATCH_02', map: 'c_map1', players: '0/16', desc: 'Deathmatch - Industrial' },
            { name: 'ASIA_TEAM_03', map: 'ctf_empty', players: '0/8', desc: 'Team Match - Empty' },
            { name: 'PRIVATE_SERVER_404', map: 'unknown', players: '?/?', desc: '[PRIVATE]' }
        ];

        let selectedServer = 0;

        function populateServers() {
            serverList.innerHTML = '';
            servers.forEach((srv, idx) => {
                const item = document.createElement('div');
                item.className = `server-item ${idx === selectedServer ? 'selected' : ''}`;
                item.innerHTML = `
                    <div class="server-name">${srv.name}</div>
                    <div class="server-info">${srv.map} | Players: ${srv.players}</div>
                    <div class="server-info" style="font-size: 0.8rem; color: #00aa00;">${srv.desc}</div>
                `;
                item.addEventListener('click', () => {
                    selectedServer = idx;
                    populateServers();
                });
                serverList.appendChild(item);
            });
        }

        populateServers();

        joinButton.addEventListener('click', () => {
            const server = servers[selectedServer];
            gameState.currentMap = server.map;
            document.getElementById('server-name').textContent = server.name;
            document.getElementById('map-name').textContent = server.map;
            controls.lock();
            addChatMessage(`[CLIENT] Connecting to ${server.name}...`, 'system');
        });

        // ============================================
        // MAIN GAME LOOP
        // ============================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            if (!gameState.isPlaying) {
                renderer.render(scene, camera);
                return;
            }

            const delta = clock.getDelta();
            gameState.timeElapsed += delta;

            // Process event timeline
            eventTimeline.forEach(evt => {
                if (!evt.triggered && gameState.timeElapsed >= evt.trigger) {
                    evt.triggered = true;
                    evt.callback();
                }
            });

            // Player movement
            if (controls.isLocked === true && !gameState.isSpectator) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                const direction = new THREE.Vector3();
                direction.z = Number(keys['w']) - Number(keys['s']);
                direction.x = Number(keys['d']) - Number(keys['a']);
                direction.normalize();

                if (keys['w'] || keys['s']) velocity.z -= direction.z * 50.0 * delta;
                if (keys['a'] || keys['d']) velocity.x -= direction.x * 50.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                // Clamp position
                camera.position.x = Math.max(-80, Math.min(80, camera.position.x));
                camera.position.z = Math.max(-80, Math.min(80, camera.position.z));
            }

            // Draw radar
            drawRadar();

            // Render
            renderer.render(scene, camera);
        }

        animate();

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
