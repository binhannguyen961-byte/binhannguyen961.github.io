<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>No Player Online - Haunted Multiplayer Server</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier Prime', monospace;
            color: #00ff00;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Main Canvas */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
            touch-action: none;
        }

        /* CRT Scan Lines Overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 100;
            opacity: 0.4;
        }

        /* Vignette Effect */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.4) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* Menu Screen */
        #menu-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
            animation: flicker 0.15s infinite;
            padding: 20px;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.97; }
        }

        #menu-screen h1 {
            font-size: clamp(2rem, 8vw, 4rem);
            margin-bottom: 20px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 20px #00ff00, 0 0 40px rgba(0, 255, 0, 0.5);
            text-align: center;
        }

        #menu-screen .subtitle {
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            margin-bottom: 40px;
            color: #00aa00;
            text-shadow: 0 0 5px #00ff00;
            text-align: center;
        }

        .server-list {
            width: 90%;
            max-width: 600px;
            max-height: 50vh;
            border: 2px solid #00ff00;
            background: #001100;
            padding: 15px;
            margin-bottom: 30px;
            overflow-y: auto;
        }

        .server-item {
            padding: 12px;
            margin: 8px 0;
            border-left: 3px solid #00ff00;
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 3px;
        }

        .server-item:active {
            background: rgba(0, 255, 0, 0.15);
        }

        .server-item.selected {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .server-name {
            font-weight: bold;
            color: #00ff00;
            font-size: clamp(0.8rem, 2.5vw, 1rem);
        }

        .server-info {
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            color: #00aa00;
            margin-top: 3px;
        }

        #join-button {
            padding: 15px 30px;
            font-size: clamp(1rem, 3vw, 1.2rem);
            background: none;
            border: 2px solid #00ff00;
            color: #00ff00;
            cursor: pointer;
            font-family: 'Courier Prime', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
            text-shadow: 0 0 10px #00ff00;
            font-weight: bold;
            border-radius: 4px;
            width: 90%;
            max-width: 300px;
        }

        #join-button:active {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 20px #00ff00;
        }

        #join-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* In-Game HUD */
        #hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 50;
            pointer-events: none;
        }

        #hud.active {
            display: block;
        }

        /* Responsive HUD Elements */
        .hud-element {
            font-size: clamp(0.65rem, 1.5vw, 0.9rem);
        }

        /* Top HUD - Server Info */
        #top-hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: auto;
            background: rgba(0, 30, 0, 0.8);
            border: 2px solid #00ff00;
            padding: 8px;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
            z-index: 51;
            min-width: auto;
            max-width: calc(100% - 20px);
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.1);
        }

        #server-status {
            margin-bottom: 3px;
        }

        #player-count {
            color: #00aa00;
        }

        #current-map {
            margin-top: 3px;
            font-size: clamp(0.6rem, 1.3vw, 0.8rem);
            color: #00aa00;
        }

        /* Chat Console */
        #chat-console {
            position: absolute;
            bottom: 70px;
            left: 10px;
            background: rgba(0, 30, 0, 0.9);
            border: 2px solid #00ff00;
            padding: 6px;
            width: calc(100% - 20px);
            max-width: 500px;
            height: 120px;
            overflow-y: auto;
            font-size: 0.75rem;
            color: #00ff00;
            text-shadow: 0 0 3px #00ff00;
            z-index: 51;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.1);
        }

        .chat-message {
            margin-bottom: 2px;
            padding: 1px 0;
            border-left: 2px solid transparent;
            padding-left: 4px;
            animation: fadeIn 0.3s ease-in;
            line-height: 1.3;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .chat-message.system {
            color: #ff0000;
            border-left-color: #ff0000;
            text-shadow: 0 0 5px #ff0000;
        }

        .chat-message.player {
            color: #ffff00;
            border-left-color: #ffff00;
        }

        .chat-message.warning {
            color: #ff6600;
            border-left-color: #ff6600;
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .chat-message.ghost {
            color: #ff00ff;
            border-left-color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            animation: glitch 0.3s;
        }

        @keyframes glitch {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            z-index: 51;
            pointer-events: none;
        }

        .crosshair-dot {
            width: 2px;
            height: 2px;
            background: #00ff00;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 5px #00ff00;
        }

        .crosshair-line {
            position: absolute;
            background: #00ff00;
            opacity: 0.6;
        }

        .crosshair-h {
            width: 15px;
            height: 1px;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
        }

        .crosshair-v {
            width: 1px;
            height: 15px;
            top: 50%;
            left: 50%;
            transform: translateY(-50%);
        }

        /* Mobile Controls */
        #mobile-controls {
            position: fixed;
            bottom: 10px;
            right: 10px;
            display: none;
            z-index: 52;
            gap: 10px;
        }

        #mobile-controls.active {
            display: flex;
            flex-direction: column;
        }

        .mobile-btn {
            width: 50px;
            height: 50px;
            background: rgba(0, 255, 0, 0.2);
            border: 2px solid #00ff00;
            color: #00ff00;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
            transition: all 0.2s;
            user-select: none;
            -webkit-user-select: none;
        }

        .mobile-btn:active {
            background: rgba(0, 255, 0, 0.4);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.6);
        }

        /* Weapon/Item Panel */
        #weapon-panel {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 30, 0, 0.8);
            border: 2px solid #00ff00;
            padding: 8px;
            z-index: 51;
            min-width: 150px;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.1);
            font-size: clamp(0.65rem, 1.5vw, 0.9rem);
        }

        #current-weapon {
            color: #ffff00;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 0 5px #ffff00;
        }

        #ammo-display {
            color: #00ff00;
            font-size: clamp(0.6rem, 1.3vw, 0.85rem);
        }

        /* Radar/Minimap */
        #radar {
            position: absolute;
            bottom: 15px;
            left: 10px;
            width: 120px;
            height: 120px;
            background: rgba(0, 30, 0, 0.8);
            border: 2px solid #00ff00;
            z-index: 51;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.1);
            display: none;
        }

        #radar.visible {
            display: block;
        }

        #radar-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Glitch Effect */
        .glitch-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.05);
            pointer-events: none;
            z-index: 90;
            display: none;
            animation: glitchScreen 0.1s infinite;
        }

        @keyframes glitchScreen {
            0% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            50% { transform: translateX(2px); }
            75% { transform: translateX(-2px); }
            100% { transform: translateX(0); }
        }

        #menu-screen.hidden {
            display: none;
        }

        /* Spectator Mode Indicator */
        #spectator-notice {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(1.5rem, 6vw, 3rem);
            color: #ff0000;
            text-shadow: 0 0 30px #ff0000;
            display: none;
            z-index: 95;
            animation: pulse 1s infinite;
            text-align: center;
        }

        /* Joystick area for mobile */
        #touch-joystick {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 100px;
            height: 100px;
            border: 2px solid rgba(0, 255, 0, 0.3);
            border-radius: 50%;
            background: rgba(0, 30, 0, 0.3);
            display: none;
            z-index: 52;
        }

        #touch-joystick.active {
            display: block;
        }

        #joystick-cursor {
            position: absolute;
            width: 30px;
            height: 30px;
            background: rgba(0, 255, 0, 0.5);
            border: 2px solid #00ff00;
            border-radius: 50%;
            top: 35px;
            left: 35px;
            pointer-events: none;
        }

        /* Responsive adjustments */
        @media (max-width: 1024px) {
            #radar {
                width: 100px;
                height: 100px;
            }

            #chat-console {
                height: 100px;
            }

            #weapon-panel {
                min-width: 140px;
            }
        }

        @media (max-width: 768px) {
            #top-hud {
                font-size: 0.7rem;
                padding: 6px;
            }

            #chat-console {
                max-width: calc(100% - 20px);
                bottom: 60px;
                height: 80px;
            }

            #weapon-panel {
                min-width: 130px;
                padding: 6px;
                font-size: 0.65rem;
            }

            #radar {
                width: 90px;
                height: 90px;
            }

            #touch-joystick {
                width: 90px;
                height: 90px;
            }

            #joystick-cursor {
                width: 25px;
                height: 25px;
                top: 32.5px;
                left: 32.5px;
            }

            .mobile-btn {
                width: 45px;
                height: 45px;
                font-size: 1rem;
            }

            #menu-screen h1 {
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            #top-hud {
                font-size: 0.6rem;
                padding: 5px;
                top: 5px;
                left: 5px;
            }

            #chat-console {
                font-size: 0.65rem;
                bottom: 55px;
                left: 5px;
                width: calc(100% - 10px);
                height: 70px;
                padding: 4px;
            }

            #weapon-panel {
                min-width: 120px;
                padding: 5px;
                font-size: 0.6rem;
                right: 5px;
                bottom: 5px;
            }

            #radar {
                width: 80px;
                height: 80px;
                left: 5px;
                bottom: 5px;
            }

            #touch-joystick {
                width: 80px;
                height: 80px;
                left: 10px;
                bottom: 10px;
            }

            #joystick-cursor {
                width: 22px;
                height: 22px;
                top: 29px;
                left: 29px;
            }

            .mobile-btn {
                width: 40px;
                height: 40px;
                font-size: 0.9rem;
            }

            #menu-screen h1 {
                font-size: 1.5rem;
                margin-bottom: 15px;
            }

            #menu-screen .subtitle {
                margin-bottom: 20px;
            }

            .server-list {
                padding: 10px;
                margin-bottom: 20px;
                max-height: 40vh;
            }

            .server-item {
                padding: 10px;
                margin: 5px 0;
            }

            #join-button {
                padding: 12px 20px;
            }
        }

        /* Landscape mode */
        @media (max-height: 500px) {
            #chat-console {
                height: 60px;
            }

            #menu-screen h1 {
                margin-bottom: 10px;
                font-size: 1.5rem;
            }

            #menu-screen .subtitle {
                margin-bottom: 15px;
                font-size: 0.9rem;
            }

            .server-list {
                max-height: 200px;
                margin-bottom: 15px;
            }
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="glitch-screen" id="glitch"></div>

    <!-- Menu Screen -->
    <div id="menu-screen">
        <h1>NO PLAYER ONLINE</h1>
        <div class="subtitle">Haunted Multiplayer Server</div>
        
        <div class="server-list" id="server-list">
            <!-- Servers populated by JS -->
        </div>

        <button id="join-button">JOIN SERVER</button>
    </div>

    <!-- In-Game HUD -->
    <div id="hud">
        <div id="top-hud" class="hud-element">
            <div id="server-status">
                Server: <span id="server-name">NA_CTF_01</span>
            </div>
            <div id="player-count">
                Players: <span id="players">1</span>/<span id="max-players">8</span>
            </div>
            <div id="current-map">
                Map: <span id="map-name">ctf_empty</span>
            </div>
        </div>

        <div id="chat-console"></div>

        <div id="touch-joystick">
            <div id="joystick-cursor"></div>
        </div>

        <div id="radar">
            <canvas id="radar-canvas" width="120" height="120"></canvas>
        </div>

        <div id="weapon-panel" class="hud-element">
            <div id="current-weapon">Crowbar</div>
            <div id="ammo-display">Ammo: ∞</div>
        </div>

        <div id="crosshair">
            <div class="crosshair-dot"></div>
            <div class="crosshair-line crosshair-h"></div>
            <div class="crosshair-line crosshair-v"></div>
        </div>

        <div id="mobile-controls">
            <button class="mobile-btn" id="btn-up">↑</button>
            <div style="display:flex; gap:5px;">
                <button class="mobile-btn" id="btn-left">←</button>
                <button class="mobile-btn" id="btn-down">↓</button>
                <button class="mobile-btn" id="btn-right">→</button>
            </div>
        </div>

        <div id="spectator-notice">YOU ARE IN SPECTATOR MODE</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // Detect platform
        const isMobile = () => {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        };

        const isTablet = () => {
            return /iPad|Android/i.test(navigator.userAgent);
        };

        const platform = {
            isMobile: isMobile(),
            isTablet: isTablet(),
            isLandscape: window.innerWidth > window.innerHeight
        };

        // ============================================
        // GAME STATE & CONFIG
        // ============================================
        const gameState = {
            isPlaying: false,
            currentMap: 'ctf_empty',
            playerCount: 1,
            maxPlayers: 8,
            hasRedKey: false,
            hasBlueKey: false,
            isSpectator: false,
            timeElapsed: 0,
            ghostsSpotted: 0,
            receivedMessages: 0
        };

        const mapData = {
            ctf_empty: {
                name: 'ctf_empty',
                displayName: 'ctf_empty_server',
                description: 'A deserted Capture The Flag arena'
            },
            c_map1: {
                name: 'c_map1',
                displayName: 'c_map1',
                description: 'Industrial Complex'
            }
        };

        // ============================================
        // THREE.JS SETUP
        // ============================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.FogExp2(0x0a0a0a, 0.015);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 1.6;

        const canvas = document.getElementById('game-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Limit pixel ratio for performance

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x888888, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(100, 100, 100);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.far = 500;
        directionalLight.shadow.camera.left = -250;
        directionalLight.shadow.camera.right = 250;
        directionalLight.shadow.camera.top = 250;
        directionalLight.shadow.camera.bottom = -250;
        scene.add(directionalLight);

        // ============================================
        // LEVEL BUILDER
        // ============================================
        function createCTFEmptyMap() {
            const floorGeo = new THREE.PlaneGeometry(200, 200);
            const floorMat = new THREE.MeshStandardMaterial({
                color: 0x222222,
                roughness: 0.9,
                metalness: 0.1
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            floor.position.y = 0;
            scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({
                color: 0x3a3a3a,
                roughness: 0.8
            });

            const walls = [
                { pos: [0, 0, -80], size: [200, 20, 5] },
                { pos: [0, 0, 80], size: [200, 20, 5] },
                { pos: [-80, 0, 0], size: [5, 20, 200] },
                { pos: [80, 0, 0], size: [5, 20, 200] }
            ];

            walls.forEach(wall => {
                const geo = new THREE.BoxGeometry(...wall.size);
                const mesh = new THREE.Mesh(geo, wallMat);
                mesh.position.set(...wall.pos);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
            });

            const flagPole1 = createFlagPole(50, 10, 'red');
            const flagPole2 = createFlagPole(-50, -10, 'blue');
            scene.add(flagPole1);
            scene.add(flagPole2);

            const boxMat = new THREE.MeshStandardMaterial({
                color: 0x555555,
                roughness: 0.7
            });

            const boxes = [
                [30, 0, 30], [-30, 0, -30], [30, 0, -30], [-30, 0, 30],
                [0, 0, 50], [0, 0, -50], [50, 0, 0], [-50, 0, 0]
            ];

            boxes.forEach(pos => {
                const geo = new THREE.BoxGeometry(15, 15, 15);
                const mesh = new THREE.Mesh(geo, boxMat);
                mesh.position.set(...pos);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
            });

            const pillarMat = new THREE.MeshStandardMaterial({
                color: 0x404040,
                roughness: 0.9
            });

            const pillars = [[40, 0, 40], [-40, 0, -40], [40, 0, -40], [-40, 0, 40]];
            pillars.forEach(pos => {
                const geo = new THREE.CylinderGeometry(3, 3, 20, 16);
                const mesh = new THREE.Mesh(geo, pillarMat);
                mesh.position.set(...pos);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
            });
        }

        function createFlagPole(x, z, color) {
            const group = new THREE.Group();
            const poleGeo = new THREE.CylinderGeometry(1, 1, 15, 8);
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.castShadow = true;
            group.add(pole);

            const flagColor = color === 'red' ? 0xff0000 : 0x0000ff;
            const flagGeo = new THREE.PlaneGeometry(8, 5);
            const flagMat = new THREE.MeshStandardMaterial({ color: flagColor });
            const flag = new THREE.Mesh(flagGeo, flagMat);
            flag.position.set(5, 5, 0);
            flag.castShadow = true;
            group.add(flag);

            group.position.set(x, 7.5, z);
            return group;
        }

        createCTFEmptyMap();

        // ============================================
        // PLAYER CONTROLS
        // ============================================
        const controls = new PointerLockControls(camera, document.body);
        const velocity = new THREE.Vector3();
        const keys = {};

        // Mobile joystick
        let joystickActive = false;
        let joystickX = 0;
        let joystickY = 0;

        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        controls.addEventListener('lock', () => {
            gameState.isPlaying = true;
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('hud').classList.add('active');
            
            // Show mobile controls if on mobile
            if (platform.isMobile && !platform.isTablet) {
                document.getElementById('mobile-controls').classList.add('active');
                document.getElementById('touch-joystick').classList.add('active');
            } else if (platform.isTablet) {
                document.getElementById('touch-joystick').classList.add('active');
                document.getElementById('radar').classList.add('visible');
            }
        });

        controls.addEventListener('unlock', () => {
            gameState.isPlaying = false;
            document.getElementById('menu-screen').classList.remove('hidden');
            document.getElementById('hud').classList.remove('active');
        });

        // ============================================
        // MOBILE TOUCH CONTROLS
        // ============================================
        if (platform.isMobile || platform.isTablet) {
            // Touch joystick
            const joystickArea = document.getElementById('touch-joystick');
            const joystickCursor = document.getElementById('joystick-cursor');

            joystickArea.addEventListener('touchstart', (e) => {
                joystickActive = true;
            });

            joystickArea.addEventListener('touchmove', (e) => {
                if (!joystickActive) return;
                const touch = e.touches[0];
                const rect = joystickArea.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                joystickX = (touch.clientX - centerX) / (rect.width / 2);
                joystickY = (touch.clientY - centerY) / (rect.height / 2);
                
                joystickX = Math.max(-1, Math.min(1, joystickX));
                joystickY = Math.max(-1, Math.min(1, joystickY));

                const moveX = joystickX * 25;
                const moveY = joystickY * 25;
                joystickCursor.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;
            });

            joystickArea.addEventListener('touchend', () => {
                joystickActive = false;
                joystickX = 0;
                joystickY = 0;
                joystickCursor.style.transform = 'translate(-50%, -50%)';
            });

            // Mobile button controls
            const btnUp = document.getElementById('btn-up');
            const btnDown = document.getElementById('btn-down');
            const btnLeft = document.getElementById('btn-left');
            const btnRight = document.getElementById('btn-right');

            if (btnUp) {
                btnUp.addEventListener('touchstart', () => { keys['w'] = true; });
                btnUp.addEventListener('touchend', () => { keys['w'] = false; });
            }

            if (btnDown) {
                btnDown.addEventListener('touchstart', () => { keys['s'] = true; });
                btnDown.addEventListener('touchend', () => { keys['s'] = false; });
            }

            if (btnLeft) {
                btnLeft.addEventListener('touchstart', () => { keys['a'] = true; });
                btnLeft.addEventListener('touchend', () => { keys['a'] = false; });
            }

            if (btnRight) {
                btnRight.addEventListener('touchstart', () => { keys['d'] = true; });
                btnRight.addEventListener('touchend', () => { keys['d'] = false; });
            }

            // Prevent default touch behaviors
            document.addEventListener('touchmove', (e) => {
                if (gameState.isPlaying) e.preventDefault();
            }, { passive: false });
        }

        // ============================================
        // CHAT SYSTEM
        // ============================================
        const chatConsole = document.getElementById('chat-console');

        function addChatMessage(text, type = 'system') {
            const msg = document.createElement('div');
            msg.className = `chat-message ${type}`;
            msg.textContent = text;
            chatConsole.appendChild(msg);
            chatConsole.scrollTop = chatConsole.scrollHeight;

            if (chatConsole.children.length > 50) {
                chatConsole.removeChild(chatConsole.children[0]);
            }
        }

        // ============================================
        // EVENT SYSTEM (HORROR ELEMENTS)
        // ============================================
        const eventTimeline = [];

        function scheduleEvent(delay, callback) {
            eventTimeline.push({
                trigger: delay,
                callback: callback,
                triggered: false
            });
        }

        scheduleEvent(1, () => {
            addChatMessage('[SERVER] Welcome to ' + mapData[gameState.currentMap].displayName, 'system');
            addChatMessage('[SERVER] Players: 1/8', 'system');
        });

        scheduleEvent(8, () => {
            addChatMessage('[SERVER] *distant footsteps*', 'system');
            playSound('footstep', 0.3);
        });

        scheduleEvent(15, () => {
            addChatMessage('[SERVER] "john_doe" joined', 'system');
            updatePlayerCount(2);
            playSound('join', 0.4);
        });

        scheduleEvent(20, () => {
            addChatMessage('john_doe: hello?', 'player');
        });

        scheduleEvent(25, () => {
            addChatMessage('john_doe: can you hear me?', 'player');
        });

        scheduleEvent(32, () => {
            addChatMessage('[SERVER] *voice received*', 'warning');
            playSound('static', 0.5);
        });

        scheduleEvent(33, () => {
            addChatMessage('john_doe: i can see you', 'ghost');
            glitchScreen();
        });

        scheduleEvent(40, () => {
            updatePlayerCount(3);
            addChatMessage('[SERVER] 2 joined', 'system');
        });

        scheduleEvent(42, () => {
            updatePlayerCount(1);
            addChatMessage('[SERVER] Disconnected', 'system');
        });

        scheduleEvent(50, () => {
            addChatMessage('[SERVER] *objects moving*', 'system');
            playSound('crash', 0.6);
            glitchScreen();
        });

        scheduleEvent(65, () => {
            addChatMessage('[SERVER] [MALFUNCTION]', 'warning');
            addChatMessage('john_doe: turn around', 'ghost');
            glitchScreen();
            enableSpectatorMode();
            playSound('static', 0.7);
        });

        scheduleEvent(75, () => {
            addChatMessage('[SERVER] ??? : not alone', 'ghost');
            glitchScreen();
            playSound('scream', 0.8);
        });

        scheduleEvent(90, () => {
            addChatMessage('[SERVER] Reset', 'system');
            resetGame();
        });

        function updatePlayerCount(count) {
            gameState.playerCount = count;
            document.getElementById('players').textContent = count;
            document.getElementById('player-count').style.color = count > 1 ? '#ff6600' : '#00ff00';
        }

        // ============================================
        // AUDIO SYSTEM
        // ============================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type, volume = 0.3) {
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                gain.gain.setValueAtTime(volume, now);

                switch (type) {
                    case 'footstep':
                        osc.frequency.setValueAtTime(80, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                        osc.start(now);
                        osc.stop(now + 0.2);
                        break;
                    case 'join':
                        osc.frequency.setValueAtTime(600, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                        osc.start(now);
                        osc.stop(now + 0.1);
                        break;
                    case 'static':
                        const bufferSize = audioCtx.sampleRate * 0.5;
                        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                        const data = buffer.getChannelData(0);
                        for (let i = 0; i < bufferSize; i++) {
                            data[i] = Math.random() * 2 - 1;
                        }
                        const source = audioCtx.createBufferSource();
                        source.buffer = buffer;
                        source.connect(gain);
                        source.start(now);
                        source.stop(now + 0.3);
                        break;
                    case 'crash':
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(50, now + 0.4);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                        osc.start(now);
                        osc.stop(now + 0.4);
                        break;
                    case 'scream':
                        osc.frequency.setValueAtTime(300, now);
                        osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                        osc.start(now);
                        osc.stop(now + 0.3);
                        break;
                }
            } catch (e) {
                console.log('Audio unavailable');
            }
        }

        // ============================================
        // VISUAL EFFECTS
        // ============================================
        function glitchScreen() {
            const glitch = document.getElementById('glitch');
            glitch.style.display = 'block';
            glitch.style.animation = 'none';
            setTimeout(() => {
                glitch.style.animation = 'glitchScreen 0.1s infinite';
            }, 10);
            setTimeout(() => {
                glitch.style.display = 'none';
            }, 300);
        }

        function enableSpectatorMode() {
            gameState.isSpectator = true;
            document.getElementById('spectator-notice').style.display = 'block';
            scene.background = new THREE.Color(0x330000);
            scene.fog.color.setHex(0x330000);
        }

        function disableSpectatorMode() {
            gameState.isSpectator = false;
            document.getElementById('spectator-notice').style.display = 'none';
            scene.background = new THREE.Color(0x0a0a0a);
            scene.fog.color.setHex(0x0a0a0a);
        }

        // ============================================
        // RADAR SYSTEM
        // ============================================
        const radarCanvas = document.getElementById('radar-canvas');
        const radarCtx = radarCanvas.getContext('2d');

        function drawRadar() {
            const size = radarCanvas.width;
            const center = size / 2;
            
            radarCtx.fillStyle = '#001100';
            radarCtx.fillRect(0, 0, size, size);

            radarCtx.strokeStyle = '#00ff00';
            radarCtx.lineWidth = 1;
            radarCtx.beginPath();
            radarCtx.arc(center, center, size * 0.45, 0, Math.PI * 2);
            radarCtx.stroke();

            radarCtx.fillStyle = '#00ff00';
            radarCtx.fillRect(center - 2, center - 2, 4, 4);

            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            const angle = Math.atan2(dir.x, dir.z);
            const endX = center + Math.sin(angle) * size * 0.2;
            const endY = center + Math.cos(angle) * size * 0.2;
            radarCtx.strokeStyle = '#ffff00';
            radarCtx.lineWidth = 2;
            radarCtx.beginPath();
            radarCtx.moveTo(center, center);
            radarCtx.lineTo(endX, endY);
            radarCtx.stroke();
        }

        // ============================================
        // GAME RESET
        // ============================================
        function resetGame() {
            gameState.timeElapsed = 0;
            gameState.playerCount = 1;
            gameState.isSpectator = false;
            disableSpectatorMode();
            chatConsole.innerHTML = '';
            eventTimeline.forEach(evt => evt.triggered = false);
        }

        // ============================================
        // SERVER MENU
        // ============================================
        const menuScreen = document.getElementById('menu-screen');
        const serverList = document.getElementById('server-list');
        const joinButton = document.getElementById('join-button');

        const servers = [
            { name: 'NA_CTF_01', map: 'ctf_empty', players: '1/8', desc: 'CTF - Empty' },
            { name: 'EU_DM_02', map: 'c_map1', players: '0/16', desc: 'Deathmatch' },
            { name: 'ASIA_TM_03', map: 'ctf_empty', players: '0/8', desc: 'Team Match' },
            { name: 'PRIVATE_404', map: 'unknown', players: '?/?', desc: '[PRIVATE]' }
        ];

        let selectedServer = 0;

        function populateServers() {
            serverList.innerHTML = '';
            servers.forEach((srv, idx) => {
                const item = document.createElement('div');
                item.className = `server-item ${idx === selectedServer ? 'selected' : ''}`;
                item.innerHTML = `
                    <div class="server-name">${srv.name}</div>
                    <div class="server-info">${srv.map} | ${srv.players}</div>
                    <div class="server-info">${srv.desc}</div>
                `;
                item.addEventListener('click', () => {
                    selectedServer = idx;
                    populateServers();
                });
                serverList.appendChild(item);
            });
        }

        populateServers();

        joinButton.addEventListener('click', () => {
            const server = servers[selectedServer];
            gameState.currentMap = server.map;
            document.getElementById('server-name').textContent = server.name;
            document.getElementById('map-name').textContent = server.map;
            controls.lock();
            addChatMessage(`[CLIENT] Connecting...`, 'system');
        });

        // ============================================
        // MAIN GAME LOOP
        // ============================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            if (!gameState.isPlaying) {
                renderer.render(scene, camera);
                return;
            }

            const delta = clock.getDelta();
            gameState.timeElapsed += delta;

            eventTimeline.forEach(evt => {
                if (!evt.triggered && gameState.timeElapsed >= evt.trigger) {
                    evt.triggered = true;
                    evt.callback();
                }
            });

            if (controls.isLocked === true && !gameState.isSpectator) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                let moveX = Number(keys['d']) - Number(keys['a']) + joystickX;
                let moveZ = Number(keys['w']) - Number(keys['s']) + joystickY;

                if (moveZ !== 0) velocity.z -= moveZ * 50.0 * delta;
                if (moveX !== 0) velocity.x -= moveX * 50.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                camera.position.x = Math.max(-80, Math.min(80, camera.position.x));
                camera.position.z = Math.max(-80, Math.min(80, camera.position.z));
            }

            drawRadar();
            renderer.render(scene, camera);
        }

        animate();

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Prevent zoom on double tap
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        document.addEventListener('gesturestart', (e) => {
            e.preventDefault();
        });
    </script>
</body>
</html>
